<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark light"><title>Berita • MarketMarney</title>
<style>
:root{--bg:#07111c;--panel:#101f2d;--ink:#eef4f9;--muted:#9bafbf;--line:#233545;--gold:#f4bc3e;--soft:#1b2a38;--shadow:0 14px 32px #0002;color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button{border:0}button:disabled{opacity:.55}a{color:inherit;text-decoration:none}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.mast{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 13px;gap:12px}.kicker{font-size:10px;color:var(--gold);font-weight:750;letter-spacing:1.7px}h1{margin:3px 0 0;font-size:30px;line-height:1.25;letter-spacing:-1px}.mast small{color:var(--muted);display:block;font-size:12px;margin-top:4px}.tools{display:flex;gap:7px}.icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-height:44px;min-width:44px;color:var(--ink);display:grid;place-items:center}.sticky{position:sticky;top:0;z-index:3;background:var(--bg);padding:0 18px 7px;border-bottom:1px solid var(--line)}.search{height:46px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 13px;margin:6px 0 12px}.search svg{color:var(--muted)}input{width:100%;border:0;outline:none;color:var(--ink);background:transparent;min-width:0;font-size:14px}input::placeholder{color:var(--muted)}.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:7px}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;min-height:40px;padding:8px 15px;color:var(--muted);border:1px solid var(--line);border-radius:30px;background:transparent;font-size:12px;font-weight:700}.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#201605}.content{padding:18px 18px 32px;max-width:800px;margin:auto}.resultbar{display:flex;justify-content:space-between;gap:10px;margin:0 2px 16px;color:var(--muted);font-size:12px}.resultbar strong{color:var(--ink)}.featured{border:1px solid var(--line);border-radius:21px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);margin-bottom:22px}.cover{position:relative;background:linear-gradient(135deg,#152e40,#233a4f);aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center}.cover img{width:100%;height:100%;object-fit:cover}.cover .placeholder{position:absolute;width:42px;height:42px;color:#7391a8}.cover img:not([src]){display:none}.featured .cover:after{content:'';position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#0c1924c9);pointer-events:none}.coverlabel{position:absolute;top:14px;left:14px;z-index:1;background:#08111dcc;color:var(--gold);font-size:10px;letter-spacing:1.2px;font-weight:800;padding:6px 9px;border-radius:7px}.featured-body{padding:17px}.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}.category{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.6px}.featured h2{font-size:22px;line-height:1.3;letter-spacing:-.6px;margin:10px 0}.summary{color:var(--muted);font-size:13px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cardfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:16px;padding-top:10px}.read{font-size:12px;font-weight:750;color:var(--gold);min-height:40px;display:flex;align-items:center;gap:7px}.save{background:transparent;color:var(--muted);width:44px;height:44px;display:grid;place-items:center;border-radius:10px}.save[aria-pressed=true]{color:var(--gold)}.save[aria-pressed=true] svg{fill:#f4bc3e22}.section-title{font-size:18px;margin:5px 0 13px;letter-spacing:-.4px}.row{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line);position:relative}.row .cover{aspect-ratio:1;border-radius:13px;align-self:start}.row .copy{min-width:0}.row h2{font-size:16px;line-height:1.38;letter-spacing:-.25px;margin:7px 0 6px}.row .rowfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;color:var(--muted)}.row .save{width:36px;height:36px;flex:none}.row .save svg{width:18px;height:18px}.loadmore,.retry{width:100%;min-height:48px;border-radius:13px;font-weight:750;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--ink);margin-top:18px}.retry{background:var(--gold);color:#201605;border:0;max-width:260px}.empty{text-align:center;padding:45px 20px;border:1px dashed var(--line);border-radius:18px;background:var(--panel)}.empty svg{width:38px;height:38px;color:var(--gold)}.empty h2{font-size:20px}.empty p{color:var(--muted);font-size:13px}.disclaimer{font-size:11px;color:var(--muted);margin-top:26px;line-height:1.6}.toast{position:fixed;left:18px;right:18px;bottom:16px;max-width:480px;margin:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:13px 17px;font-size:13px;box-shadow:var(--shadow);z-index:9}.skeleton{height:15px;border-radius:6px;background:var(--soft);margin:13px 0;animation:pulse 1.4s ease-in-out infinite alternate}.sk-cover{height:180px;border-radius:18px}.sk-short{width:50%}@keyframes pulse{to{opacity:.35}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}[hidden]{display:none!important}html[data-theme=light]{--bg:#f5f7fa;--panel:#fff;--ink:#122536;--muted:#5d7286;--line:#dce4eb;--gold:#996019;--soft:#e5ebf1;color-scheme:light}html[data-theme=light] .chip[aria-pressed=true],html[data-theme=light] .retry{background:#f7c867;color:#261900}html[data-theme=light] .coverlabel{color:#f4bc3e}html[data-theme=light] .category{color:#996019}@media(min-width:700px){.mast,.sticky{max-width:800px;margin:auto}.row{grid-template-columns:150px minmax(0,1fr)}.row h2{font-size:20px}}
</style></head><body>
<header class="mast"><div><div class="kicker">MARKETMARNEY / NEWSROOM</div><h1>Berita</h1><small>Informasi pasar, dalam satu tempat.</small></div><div class="tools"><button class="icon-btn" id="theme" aria-label="Ganti tema" title="Ganti tema"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/></svg></button><button class="icon-btn" id="refresh" aria-label="Muat ulang berita" title="Muat ulang berita"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button></div></header>
<div class="sticky"><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Cari emas, forex, kripto…" aria-label="Cari berita" maxlength="100" autocomplete="off"></label><nav class="filters" id="filters" aria-label="Kategori berita"></nav></div>
<main class="content"><div class="resultbar"><span id="count" role="status">Memuat berita…</span><span id="updated">Terbaru dahulu</span></div><div id="list" aria-busy="true"></div><button id="more" class="loadmore" hidden>Tampilkan berita lainnya</button><p class="disclaimer">Konten berasal dari artikel yang diterbitkan MarketMarney. Informasi ini bukan rekomendasi investasi. Simpan artikel hanya menyimpan penanda di perangkat, bukan salinan offline.</p></main><div id="toast" class="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const CATS=['Semua','Emas','Forex','Kripto','Saham','Ekonomi','Disimpan'];let all=[],filter='Semua',query='',limit=12,busy=false,seq=0,toastTimer;
let saved=new Set();try{const v=JSON.parse(localStorage.getItem('mm43-news-saved')||'[]');if(Array.isArray(v))saved=new Set(v.filter(x=>typeof x==='string').slice(0,500));}catch(e){}
try{document.documentElement.dataset.theme=localStorage.getItem('mm43-news-theme')||'dark';}catch(e){}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
const bookmark='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>';
const picture='<svg class="placeholder" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18 9 12l4 3 8-10M16 5h5v5"/><path d="M3 3v18h18"/></svg>';
const norm=s=>String(s||'').normalize('NFKD').toLowerCase();
function plain(v){const d=new DOMParser().parseFromString(String(v||''),'text/html');return (d.body.textContent||'').trim();}
function stamp(a){const n=Date.parse(String(a.date||a.publishedAt||a.createdAt||''));return Number.isFinite(n)?n:0;}
function date(a){const n=stamp(a);return n?new Date(n).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'MarketMarney';}
function group(a){const c=norm(a.cat||a.category),t=norm(a.title);const v=c+' '+t;if(/emas|\bgold\b|xau/.test(v))return 'Emas';if(/kripto|crypto|bitcoin|ethereum|\bbtc\b|\beth\b/.test(v))return 'Kripto';if(/forex|eur\/usd|gbp\/usd|usd\/jpy|eurusd|usdjpy|gbpusd|valas/.test(v))return 'Forex';if(/saham|stock|ihsg|nasdaq|s&p|ekuitas/.test(v))return 'Saham';return 'Ekonomi';}
function url(a){return '/index.html#artikel/'+encodeURIComponent(String(a.id));}
function img(a){try{const u=new URL(String(a.img||a.imageUrl||a.thumbnail||''),location.origin);if(u.protocol==='https:'&&!u.username&&!u.password&&String(a.img||a.imageUrl||a.thumbnail||''))return u.href;}catch(e){}return '';}
function cover(a,featured){const wrap=el('div','cover');wrap.innerHTML=picture;const src=img(a);if(src){const image=el('img');image.src=src;image.alt='';image.loading=featured?'eager':'lazy';image.decoding='async';image.referrerPolicy='no-referrer';image.onload=()=>wrap.querySelector('.placeholder').hidden=true;image.onerror=()=>image.remove();wrap.append(image);}if(featured)wrap.append(el('span','coverlabel','SOROTAN TERBARU'));return wrap;}
function notify(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2300);}
function save(a){const key=String(a.id),b=el('button','save');b.innerHTML=bookmark;const sync=()=>{b.setAttribute('aria-pressed',String(saved.has(key)));b.setAttribute('aria-label',(saved.has(key)?'Hapus dari simpanan: ':'Simpan artikel: ')+a.title);};sync();b.onclick=()=>{const existed=saved.has(key);if(existed)saved.delete(key);else saved.add(key);if(saved.size>500)saved.delete(saved.values().next().value);try{localStorage.setItem('mm43-news-saved',JSON.stringify([...saved]));sync();notify(existed?'Artikel dihapus dari simpanan.':'Artikel disimpan di perangkat.');if(filter==='Disimpan')render();}catch(e){if(existed)saved.add(key);else saved.delete(key);sync();notify('Penyimpanan perangkat tidak tersedia.');}};return b;}
function meta(a){const m=el('div','meta');m.append(el('span','category',String(a.cat||a.category||group(a)).slice(0,35)),el('span','','•'),el('time','',date(a)));return m;}
function article(a,featured){const item=el('article',featured?'featured':'row');const imageLink=el('a');imageLink.href=url(a);imageLink.setAttribute('aria-label',String(a.title));imageLink.append(cover(a,featured));item.append(imageLink);const copy=el('div',featured?'featured-body':'copy');copy.append(meta(a));const titleLink=el('a');titleLink.href=url(a);titleLink.append(el('h2','',String(a.title)));copy.append(titleLink);
if(featured){copy.append(el('p','summary',plain(a.desc||a.summary||a.body).slice(0,280)));const foot=el('div','cardfoot');const read=el('a','read','Baca selengkapnya  →');read.href=url(a);foot.append(read,save(a));copy.append(foot);}else{const f=el('div','rowfoot');f.append(el('span','',a.source?String(a.source).slice(0,45):'MarketMarney'),save(a));copy.append(f);}item.append(copy);return item;}
function empty(title,message,retry=false){const d=el('div','empty');d.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg>';d.append(el('h2','',title),el('p','',message));if(retry){const b=el('button','retry','Coba lagi');b.onclick=load;d.append(b);}return d;}
function render(){const arr=all.filter(a=>(filter==='Semua'||(filter==='Disimpan'?saved.has(String(a.id)):group(a)===filter))&&(!query||norm(a.title+' '+plain(a.desc||a.summary)+' '+(a.cat||a.category)).includes(query)));const list=$('list');list.replaceChildren();list.setAttribute('aria-busy','false');$('count').textContent=arr.length+' artikel'+(filter==='Disimpan'?' tersimpan':'');$('more').hidden=arr.length<=limit;
if(!arr.length){list.append(empty(filter==='Disimpan'?'Belum ada artikel tersimpan':'Tidak ada berita yang cocok',filter==='Disimpan'?'Ketuk ikon penanda pada artikel untuk menyimpannya.':'Coba kata kunci lain atau pilih kategori Semua.'));return;}
arr.slice(0,limit).forEach((a,i)=>{if(i===1)list.append(el('h2','section-title','Artikel lainnya'));list.append(article(a,i===0));});}
for(const cat of CATS){const b=el('button','chip',cat);b.setAttribute('aria-pressed',String(cat===filter));b.onclick=()=>{filter=cat;limit=12;for(const c of $('filters').children)c.setAttribute('aria-pressed',String(c===b));render();};$('filters').append(b);}
$('search').addEventListener('input',()=>{query=norm($('search').value.trim());limit=12;if(!busy)render();});$('more').onclick=()=>{limit+=12;render();};$('refresh').onclick=load;
$('theme').onclick=()=>{const theme=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('mm43-news-theme',theme);}catch(e){}};
async function load(){const run=++seq;busy=true;$('refresh').disabled=true;$('list').setAttribute('aria-busy','true');$('more').hidden=true;$('count').textContent='Memuat berita…';$('list').innerHTML='<div class="skeleton sk-cover"></div><div class="skeleton sk-short"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton sk-cover"></div>';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
try{const r=await fetch('/api/content',{credentials:'same-origin',cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.articles))throw Error('Format respons');if(run!==seq)return;all=d.articles.filter(a=>a&&a.id!=null&&typeof a.title==='string'&&(!a.status||a.status==='published')).sort((a,b)=>stamp(b)-stamp(a));$('updated').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});render();}
catch(e){if(run!==seq)return;$('count').textContent='Belum terhubung';$('updated').textContent='';$('list').setAttribute('aria-busy','false');$('list').replaceChildren(empty('Berita belum dapat dimuat','Periksa koneksi internet Anda. Kami tidak menampilkan berita atau angka buatan.',true));}
finally{clearTimeout(timer);if(run===seq){busy=false;$('refresh').disabled=false;}}}
load();
})();
</script></body></html>
