name: MarketMarney Premium Opening APK Preview
on:
  push:
    branches:
      - feature/premium-opening-marney-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure existing Android launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 https://marketmarney.com/icons/icon-512.png -o android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build Android debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 android-app/app/build/outputs/apk/debug/app-debug.apk | grep -q '^classes.*\.dex$'
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-Premium-Opening-v3-1-Debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
