name: Build Marney Android v4.2 Stable UI-Preserved Beta

on:
  push:
    branches:
      - fix/marney-preserve-original-ui-20261112
      - fix/site-performance-audit-20261108
      - feat/marney-stability-v4-1-20261112
      - feat/marney-stability-v4-2-20261113
    paths:
      - 'android-app/**'
      - '.github/workflows/build-marney-v4-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply UI-preserved Marney v4 base
        run: python3 android-app/apply-marney-v4.py

      - name: Verify original Marney interface
        run: python3 android-app/finalize-marney-v4.py

      - name: Apply v4.1 stability improvements without changing UI
        run: python3 android-app/apply-marney-v4-1.py

      - name: Isolate Android 8 WebView recovery from Android 7 path
        run: python3 android-app/refactor-marney-v4-1-compat.py

      - name: Verify v4.1 features and locked visual fingerprint
        run: python3 android-app/finalize-marney-v4-1.py

      - name: Apply v4.2 connectivity and upload reliability without changing UI
        run: python3 android-app/apply-marney-v4-2.py

      - name: Verify v4.2 reliability and locked visual fingerprint
        run: python3 android-app/finalize-marney-v4-2.py

      - name: Snapshot generated Android sources
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java \
             Marney-v4.2.0-generated-MainActivity.java
          cp android-app/app/src/main/AndroidManifest.xml \
             Marney-v4.2.0-generated-AndroidManifest.xml
          cp android-app/app/build.gradle \
             Marney-v4.2.0-generated-build.gradle
          sha256sum Marney-v4.2.0-generated-MainActivity.java \
            | tee Marney-v4.2.0-generated-MainActivity.sha256

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare current MarketMarney icon
        shell: bash
        run: |
          set -euo pipefail
          ICON=android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p "$(dirname "$ICON")"
          if ! curl -fLsS --retry 6 --retry-all-errors --connect-timeout 15 --max-time 150 \
            https://marketmarney.com/icons/icon-512.png -o "$ICON"; then
            echo 'Public icon download failed; keeping the repository icon unchanged.'
            test -s "$ICON"
          fi
          file "$ICON"
          test -s "$ICON"

      - name: Compile Marney v4.2 UI-preserved debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate identity, permissions, reliability and preserved interface
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          OUT=Marney-v4.2.0-Stable-UI-Preserved-Beta.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"

          "$AAPT" dump badging "$APK" | tee Marney-v4.2.0-badging.txt
          "$AAPT" dump permissions "$APK" | tee Marney-v4.2.0-permissions.txt
          grep -F "package: name='com.marketmarney.mobile'" Marney-v4.2.0-badging.txt
          grep -F "versionCode='8'" Marney-v4.2.0-badging.txt
          grep -F "versionName='4.2.0-beta'" Marney-v4.2.0-badging.txt
          grep -F "sdkVersion:'24'" Marney-v4.2.0-badging.txt
          grep -F 'com.marketmarney.mobile.MainActivity' Marney-v4.2.0-badging.txt
          grep -F "uses-feature-not-required: name='android.hardware.camera'" Marney-v4.2.0-badging.txt
          grep -F "uses-feature-not-required: name='android.hardware.microphone'" Marney-v4.2.0-badging.txt
          grep -F 'android.permission.INTERNET' Marney-v4.2.0-permissions.txt
          grep -F 'android.permission.ACCESS_NETWORK_STATE' Marney-v4.2.0-permissions.txt
          grep -F 'android.permission.CAMERA' Marney-v4.2.0-permissions.txt
          grep -F 'android.permission.RECORD_AUDIO' Marney-v4.2.0-permissions.txt

          SOURCE=android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          MANIFEST=android-app/app/src/main/AndroidManifest.xml
          grep -F 'private static final int NAVY = Color.rgb(5, 17, 33);' "$SOURCE"
          grep -F 'top.setBackgroundColor(Color.rgb(6, 21, 38));' "$SOURCE"
          grep -F 'String[] labels = {"Beranda", "Pasar", "Berita", "Social", "Akun"};' "$SOURCE"
          grep -F 'MARNEY_ANDROID_V4_2_CONNECTIVITY_UPLOAD_SAFE_UI_PRESERVED' "$SOURCE"
          grep -F 'registerDefaultNetworkCallback' "$SOURCE"
          grep -F 'NET_CAPABILITY_VALIDATED' "$SOURCE"
          grep -F 'verifiedContentLength' "$SOURCE"
          grep -F 'Executors.newFixedThreadPool(2)' "$SOURCE"
          grep -F 'fileChooserGeneration' "$SOURCE"
          grep -F 'onSaveInstanceState(Bundle outState)' "$SOURCE"
          grep -F 'onRenderProcessGone' "$SOURCE"
          grep -F 'FLAG_KEEP_SCREEN_ON' "$SOURCE"
          grep -F 'android:configChanges="orientation|screenSize|keyboardHidden"' "$MANIFEST"
          grep -F 'android:hardwareAccelerated="true"' "$MANIFEST"
          grep -F 'android:enableOnBackInvokedCallback="false"' "$MANIFEST"
          ! grep -F 'lightModeScript' "$SOURCE"
          ! grep -F "localStorage.setItem('mm_theme'" "$SOURCE"
          ! grep -F 'setNativeChromeVisible' "$SOURCE"

          test "$(unzip -Z1 "$APK" | grep -c '^classes.*\.dex$')" -gt 0
          unzip -t "$APK" | tee Marney-v4.2.0-archive-test.txt

          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee Marney-v4.2.0-Stable-UI-Preserved-Beta.sha256
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Marney-v4.2.0-Stable-UI-Preserved-Beta
          path: |
            Marney-v4.2.0-Stable-UI-Preserved-Beta.apk
            Marney-v4.2.0-Stable-UI-Preserved-Beta.sha256
            Marney-v4.2.0-badging.txt
            Marney-v4.2.0-permissions.txt
            Marney-v4.2.0-archive-test.txt
            Marney-v4.2.0-generated-MainActivity.java
            Marney-v4.2.0-generated-MainActivity.sha256
            Marney-v4.2.0-generated-AndroidManifest.xml
            Marney-v4.2.0-generated-build.gradle
          if-no-files-found: error
          retention-days: 30
