name: Build Marney Android UI-Preserved Beta

on:
  push:
    branches:
      - fix/marney-preserve-original-ui-20261112
      - fix/site-performance-audit-20261108
      - feat/marney-stability-v4-1-20261112
    paths:
      - 'android-app/**'
      - '.github/workflows/build-marney-v4-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply functional improvements without changing UI
        run: python3 android-app/apply-marney-v4.py

      - name: Verify original Marney interface is preserved
        run: python3 android-app/finalize-marney-v4.py

      - name: Snapshot generated Android source
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java \
             Marney-v4.0.1-generated-MainActivity.java
          sha256sum Marney-v4.0.1-generated-MainActivity.java \
            | tee Marney-v4.0.1-generated-MainActivity.sha256

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare current MarketMarney icon
        shell: bash
        run: |
          set -euo pipefail
          ICON=android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          mkdir -p "$(dirname "$ICON")"
          if ! curl -fLsS --retry 6 --retry-all-errors --connect-timeout 15 --max-time 150 \
            https://marketmarney.com/icons/icon-512.png -o "$ICON"; then
            echo 'Public icon download failed; keeping the repository icon unchanged.'
            test -s "$ICON"
          fi
          file "$ICON"
          test -s "$ICON"

      - name: Compile Marney UI-preserved debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate identity, permissions and preserved interface
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          OUT=Marney-v4.0.1-UI-Preserved-Beta.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"

          "$AAPT" dump badging "$APK" | tee Marney-v4.0.1-badging.txt
          "$AAPT" dump permissions "$APK" | tee Marney-v4.0.1-permissions.txt
          grep -F "package: name='com.marketmarney.mobile'" Marney-v4.0.1-badging.txt
          grep -F "versionCode='6'" Marney-v4.0.1-badging.txt
          grep -F "versionName='4.0.1-beta'" Marney-v4.0.1-badging.txt
          grep -F 'com.marketmarney.mobile.MainActivity' Marney-v4.0.1-badging.txt
          grep -F "uses-feature-not-required: name='android.hardware.camera'" Marney-v4.0.1-badging.txt
          grep -F "uses-feature-not-required: name='android.hardware.microphone'" Marney-v4.0.1-badging.txt
          grep -F 'android.permission.CAMERA' Marney-v4.0.1-permissions.txt
          grep -F 'android.permission.RECORD_AUDIO' Marney-v4.0.1-permissions.txt
          grep -F 'android.permission.INTERNET' Marney-v4.0.1-permissions.txt

          grep -F 'private static final int NAVY = Color.rgb(5, 17, 33);' android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          grep -F 'top.setBackgroundColor(Color.rgb(6, 21, 38));' android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          grep -F 'String[] labels = {"Beranda", "Pasar", "Berita", "Social", "Akun"};' android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          ! grep -F 'lightModeScript' android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          ! grep -F "localStorage.setItem('mm_theme'" android-app/app/src/main/java/com/marketmarney/mobile/MainActivity.java

          test "$(unzip -Z1 "$APK" | grep -c '^classes.*\.dex$')" -gt 0
          unzip -t "$APK" | tee Marney-v4.0.1-archive-test.txt

          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee Marney-v4.0.1-UI-Preserved-Beta.sha256
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Marney-v4.0.1-UI-Preserved-Beta
          path: |
            Marney-v4.0.1-UI-Preserved-Beta.apk
            Marney-v4.0.1-UI-Preserved-Beta.sha256
            Marney-v4.0.1-badging.txt
            Marney-v4.0.1-permissions.txt
            Marney-v4.0.1-archive-test.txt
            Marney-v4.0.1-generated-MainActivity.java
            Marney-v4.0.1-generated-MainActivity.sha256
          if-no-files-found: error
          retention-days: 30
