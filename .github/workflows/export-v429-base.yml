name: Export Marney 4.29 Base
on:
  push:
    branches: [android-v4.29-social-fullscreen]
    paths: ['.github/workflows/export-v429-base.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Marney 4.28 source
        shell: bash
        run: |
          set -euo pipefail
          cat mobile428/source.part1 mobile428/source.part2 mobile428/source.part3 mobile428/source.part4 mobile428/source.part5 | base64 -d > /tmp/mobile428-source.tar.gz
          echo '02d81f1767bada09a687d2ae5d08f0d07ec7b85f149943ddbfa40dffa3a479bf  /tmp/mobile428-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mobile428-source.tar.gz -C mobile428
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,stat
          z=Path('mobile419/base418-source.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          with ZipFile(z) as a:
              assert a.testzip() is None
              for e in a.infolist():
                  p=Path(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(e.external_attr>>16)
                  if p.parts and p.parts[0]=='android417': a.extract(e,'.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py
          mv android419 android420; python3 mobile420/prepare420.py
          mv android420 android421; python3 mobile421/prepare421.py
          mv android421 android422; python3 mobile422/prepare422.py
          mv android422 android423; python3 mobile423/prepare423.py
          mv android423 android424; python3 mobile424/prepare424.py
          mv android424 android425; python3 mobile425/prepare425.py
          python3 final425/finalize425.py
          mv android425 android426; python3 mobile426/prepare426.py
          mv android426 android427; python3 mobile427/prepare427.py
          mv android427 android428; python3 mobile428/prepare428.py
      - name: Package relevant source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          cp -a android428/app/src/main/java/com/marketmarney/mobile diagnostic/java
          cp -a android428/app/src/main/res diagnostic/res
          cp -a android428/app/src/main/assets/social411 diagnostic/social411
          cp -a android428/app/src/main/assets/group48 diagnostic/group48
          cp -a android428/app/src/main/assets/profile49 diagnostic/profile49
          cp android428/app/build.gradle diagnostic/app-build.gradle
          cp android428/settings.gradle diagnostic/settings.gradle
          tar -czf diagnostic/Marney428-Social-Base.tar.gz -C diagnostic java res social411 group48 profile49 app-build.gradle settings.gradle
      - uses: actions/upload-artifact@v4
        with:
          name: Marney428-Social-Base
          path: diagnostic/Marney428-Social-Base.tar.gz
          if-no-files-found: error
