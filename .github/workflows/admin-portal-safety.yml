name: Admin portal safety
on:
  pull_request:
    paths:
      - 'warxau-fbs/admin-portal.cjs'
      - 'warxau-fbs/admin-portal.test.cjs'
      - 'warxau-fbs/start-ihsg.cjs'
      - '.github/workflows/admin-portal-safety.yml'
  push:
    branches:
      - fix/admin-portal-route-20261113
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check warxau-fbs/admin-portal.cjs
      - run: node --check warxau-fbs/marney-token-creator.cjs
      - run: node --check warxau-fbs/marney-whitepaper.cjs
      - run: node --test warxau-fbs/marney-whitepaper.test.cjs
      - run: node --check warxau-fbs/marney-token-creator-client.js
      - run: node --check warxau-fbs/token-creator-nav.cjs
      - run: node --test warxau-fbs/marney-token-creator.test.cjs warxau-fbs/token-creator-nav.test.cjs
      - run: node --check warxau-fbs/hash-article-fix.cjs
      - run: node --test warxau-fbs/hash-article-fix.test.cjs
      - run: node --check warxau-fbs/start-ihsg.cjs
      - run: node --check warxau-fbs/editorial-article-clean.cjs
      - run: node --check warxau-fbs/bootstrap.cjs
      - run: node --test warxau-fbs/editorial-article-clean.test.cjs
      - run: node --test warxau-fbs/admin-portal.test.cjs
      - run: node --check warxau-fbs/article-reading-width.cjs
      - run: node -e "const a=require('./warxau-fbs/article-reading-width.cjs');const h='<html><head></head><body>mm-editorial-fb17f057e34a2a830d91d723</body></html>';const out=a.injectReadingWidthStyle(h);if(!out.includes('mm-global-news-polish-v1'))process.exit(1);require('node:vm').createScript(a.ARTICLE_POLISH_SCRIPT.replace(/^<script[^>]*>/,'').replace(/<\\/script>$/,''));"
