name: Inspect MarketMarney 4.35 Base
on:
  push:
    branches: [android-v4.35-stability]
    paths: ['.github/workflows/inspect435.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct 4.34 and inspect lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cat mobile428/source.part1 mobile428/source.part2 mobile428/source.part3 mobile428/source.part4 mobile428/source.part5 | base64 -d > /tmp/mobile428-source.tar.gz
          echo '02d81f1767bada09a687d2ae5d08f0d07ec7b85f149943ddbfa40dffa3a479bf  /tmp/mobile428-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mobile428-source.tar.gz -C mobile428
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0 >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, stat
          z=Path('mobile419/base418-source.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          with ZipFile(z) as archive:
              assert archive.testzip() is None
              for entry in archive.infolist():
                  path=Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not stat.S_ISLNK(entry.external_attr>>16)
                  if path.parts and path.parts[0]=='android417': archive.extract(entry,'.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py >/dev/null
          mv android419 android420; python3 mobile420/prepare420.py >/dev/null
          mv android420 android421; python3 mobile421/prepare421.py >/dev/null
          mv android421 android422; python3 mobile422/prepare422.py >/dev/null
          mv android422 android423; python3 mobile423/prepare423.py >/dev/null
          mv android423 android424; python3 mobile424/prepare424.py >/dev/null
          mv android424 android425; python3 mobile425/prepare425.py >/dev/null
          python3 final425/finalize425.py >/dev/null
          mv android425 android426; python3 mobile426/prepare426.py >/dev/null
          mv android426 android427; python3 mobile427/prepare427.py >/dev/null
          mv android427 android428; python3 mobile428/prepare428.py >/dev/null
          mv android428 android429; python3 mobile429/prepare429.py >/dev/null
          mv android429 android430; python3 mobile430/prepare430.py >/dev/null
          mv android430 android431; python3 mobile431/prepare431.py >/dev/null
          mv android431 android432; python3 mobile432/prepare432.py >/dev/null
          mv android432 android433; python3 mobile433/prepare433.py >/dev/null
          mv android433 android434; python3 mobile434/prepare434.py >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android434/app/src/main/java/com/marketmarney/mobile/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          print('FILE_BYTES',len(s.encode()))
          for token in ['private void navigate(', 'private void open(', 'private WebView create', 'private WebView new', 'private void adapt(', 'private void showOffline(', 'protected void onCreate(', 'protected void onStart(', 'protected void onResume(', 'protected void onPause(', 'protected void onStop(', 'public void onTrimMemory(', 'protected void onDestroy(']:
              i=s.find(token)
              print('\n===== TOKEN',token,'INDEX',i,'=====')
              if i<0: continue
              start=s.rfind('\n',0,i)+1
              brace=s.find('{',i)
              if brace<0:
                  print(s[start:i+500]); continue
              depth=0; end=None
              in_str=False; esc=False; quote=''
              for j in range(brace,len(s)):
                  c=s[j]
                  if in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: in_str=False
                      continue
                  if c in ('\"',"'"):
                      in_str=True; quote=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          end=j+1; break
              print(s[start:end if end else min(len(s),i+5000)])
          print('\n===== FIELDS =====')
          for needle in ['lastAdaptedDocument','navigationSequence','lastReloadAt','retained =','slowTask','onPageStarted','onPageFinished','onReceivedError','onRenderProcessGone']:
              print('\n---',needle,'---')
              pos=0; count=0
              while True:
                  pos=s.find(needle,pos)
                  if pos<0: break
                  a=max(0,s.rfind('\n',0,max(0,pos-250)))
                  b=min(len(s),s.find('\n',min(len(s),pos+500)))
                  print(s[a:b])
                  pos+=len(needle); count+=1
                  if count>=8: break
          PY
