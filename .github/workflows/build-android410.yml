name: Marney 4.10 Launch Animation
on:
  push:
    branches: [android-v4.10-launch-animation]
    paths: ['mobile410/**', '.github/workflows/build-android410.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marney410-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney49-Beta-APK
          run-id: 42154094877
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: base49
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply only launch-screen changes to pinned stable source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          assert hashlib.sha256(Path('base49/Marney49.apk').read_bytes()).hexdigest()=='80145da5cd618718e9819e110b5b9e387c8f56d69464a07a00d1a6f4d0ccbfe3'
          with zipfile.ZipFile('base49/Marney49-Source.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():assert not n.startswith('/') and '..' not in Path(n).parts
              z.extractall('.')
          files=list(Path('android43/app/src/main/assets').rglob('*'))+[Path('android43/app/src/main/java/com/marketmarney/mobile/'+n) for n in ['AppResources49.java','AndroidGoogleLogin.java']]
          Path('preserved-before.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.is_file()}))
          PY
          python3 mobile410/prepare410.py android43
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          data=json.loads(Path('preserved-before.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest()==h for p,h in data.items())
          print('PASS:',len(data),'existing app assets and auth/worker source files unchanged')
          PY
      - name: Compile app, instrumentation tests and lint
        run: gradle --no-daemon --project-dir android43 :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify APK and collect outputs
        run: |
          set -euo pipefail
          mkdir -p deliver testapk
          APK=android43/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney410-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney410-Package.txt
          grep -F "name='com.marketmarney.mobile.beta410'" deliver/Marney410-Package.txt
          grep -F "versionName='4.10.0-beta'" deliver/Marney410-Package.txt
          cp "$APK" deliver/Marney410.apk
          cp android43/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk testapk/Marney410-Tests.apk
          cp android43/app/build/reports/lint-results-debug.html deliver/Marney410-Lint.html
          cp preserved-before.json deliver/Marney410-Unchanged.json
          sha256sum deliver/Marney410.apk > deliver/Marney410-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('deliver/Marney410-Source.zip','w',ZIP_DEFLATED) as z:
              for root in [Path('android43'),Path('mobile410')]:
                  for p in root.rglob('*'):
                      if not p.is_file() or any(x in p.parts for x in ['build','.gradle','.git','__pycache__']):continue
                      if p.suffix in ['.jks','.keystore','.ttf','.otf','.woff','.woff2'] or p.name in ['local.properties','.env']:continue
                      z.write(p,p)
          Path('deliver/Marney410-Panduan.md').write_text('''# Marney 4.10 Animasi
          Animasi pembuka native dengan logo asli, orbit emas, grid/candlestick dekoratif, dan transisi lembut.
          Beranda dimuat bersamaan. Tidak menunggu siklus animasi selesai. Animasi ditutup saat frame halaman pertama tampil atau ketika terjadi error.
          Tombol Lewati animasi selalu tersedia. Batas pengaman 4 detik hanya mencegah overlay menggantung, bukan waktu tunggu minimum.
          Mengikuti pengaturan animasi sistem dan hemat baterai; dihentikan saat aplikasi masuk latar belakang.
          Tidak ada video/audio/permintaan jaringan baru untuk animasi. Sumber grup, profil, Reels dan login dari 4.9 dipertahankan byte-per-byte.
          Pasang APK sebagai aplikasi terpisah Marney 4.10 Animasi; jangan hapus aplikasi utama. Package com.marketmarney.mobile.beta410.
          Google Login native belum terdaftar untuk package beta ini. Login email hanya untuk akun yang memiliki kata sandi.
          Tidak mengubah server, database, Google Cloud atau menerbitkan aplikasi. Belum diukur pada HP pengguna.
          ''')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Marney410-Beta-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Marney410-Test-APK
          path: testapk/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Marney410-Build-Diagnostics
          path: android43/app/build/reports/
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney410-Beta-APK
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: Marney410-Test-APK
          path: testapk
      - name: Prepare regression script
        run: |
          python3 -m pip install websocket-client
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile49/test_device49.py');s=p.read_text().replace("Path('quality49-device')","Path('quality410/regression')").replace('O.mkdir(exist_ok=True)','O.mkdir(parents=True,exist_ok=True)').replace('com.marketmarney.mobile.beta49','com.marketmarney.mobile.beta410').replace('apk/Marney49.apk','apk/Marney410.apk');p.write_text(s)
          PY
          cat > test410.sh <<'SH'
          set -euo pipefail
          mkdir -p quality410
          adb shell wm size 480x900
          adb shell wm density 180
          adb shell settings put global animator_duration_scale 1
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb install -r apk/Marney410.apk
          adb install -r testapk/Marney410-Tests.apk
          adb logcat -c
          adb shell am instrument -w -r -e class com.marketmarney.mobile.StartupOverlayTest com.marketmarney.mobile.beta410.test/androidx.test.runner.AndroidJUnitRunner | tee quality410/instrumentation.txt
          adb pull /sdcard/Android/data/com.marketmarney.mobile.beta410/files/launch-tests quality410/launch-tests || true
          adb logcat -d -s MM410_LAUNCH:I AndroidRuntime:E > quality410/launch.log
          grep -Eq 'OK \(8 tests\)' quality410/instrumentation.txt
          adb shell am force-stop com.marketmarney.mobile.beta410
          python3 mobile49/test_device49.py
          SH
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 launch animation and unchanged group/profile flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: bash test410.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney410-Android-Evidence
          path: quality410/
