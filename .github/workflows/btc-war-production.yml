name: Verify deployed BTCUSD War
on:
  push:
    branches: [btc-war-v1-20261107]
    paths: ['.github/workflows/btc-war-production.yml']
permissions:
  contents: write
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btc-war-v1-20261107
      - name: Install Chromium
        run: python3 -m pip install playwright && python3 -m playwright install chromium --with-deps
      - name: Read-only public checks and real Kraken reception
        run: python3 warxau-fbs/verify-btc-public.py
      - name: Capture actual 3D page in clearly labeled DEMO mode
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True,args=['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
            pg=b.new_page(viewport={'width':1440,'height':1000})
            pg.goto('https://marketmarney.com/assets/btc-war-3d.html?v=1.0',wait_until='load',timeout=60000)
            pg.wait_for_function('window.MM_WAR?.ready',timeout=30000)
            pg.locator('#mode-demo').click()
            pg.locator('[data-quick-pips="20"]').click()
            pg.evaluate('window.scrollTo(0,0)')
            pg.wait_for_function('MM_WAR.getSnapshot().sceneTime>2',polling=500,timeout=60000)
            pg.screenshot(path='BTCUSD-War-Desktop-DEMO.png',timeout=60000)
            b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-war-production
          path: |
            btc-production-check.json
            BTCUSD-War-Desktop-DEMO.png
          retention-days: 7
      - name: Record verification
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add btc-production-check.json
          git diff --cached --quiet || git commit -m 'Record public BTC War price/chat/access checks'
          git push origin HEAD:btc-war-v1-20261107
