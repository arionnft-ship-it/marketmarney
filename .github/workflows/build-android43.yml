name: MarketMarney 4.3 Four Tabs and Social Feed
on:
  push:
    branches: [android-v4.3-social-news]
    paths: ['mobile43/**', '.github/workflows/build-android43.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marketmarney-beta43
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test library
        run: python3 -m pip install playwright==1.56.0
      - name: Run responsive news and social tests
        run: |
          python3 mobile43/prepare.py --ui
          python3 mobile43/test_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarketMarney43-UI-Tests
          path: quality43/
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble isolated beta source
        run: |
          set -euo pipefail
          python3 mobile43/prepare.py
          mkdir -p android43/app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 45 https://marketmarney.com/icons/icon-512.png -o android43/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build and lint Android beta
        run: gradle --no-daemon --project-dir android43 :app:assembleDebug :app:lintDebug
      - name: Verify APK and package deliverables
        run: |
          set -euo pipefail
          mkdir -p deliver43
          cp android43/app/build/outputs/apk/debug/app-debug.apk deliver43/Marney43.apk
          APK=deliver43/Marney43.apk
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print -quit)"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print -quit)"
          "$AAPT" dump badging "$APK" > deliver43/APK-IDENTITY.txt
          grep -F "com.marketmarney.mobile.beta43" deliver43/APK-IDENTITY.txt
          "$APKSIGNER" verify --print-certs "$APK" > deliver43/APK-CERTIFICATE.txt
          sha256sum "$APK" > deliver43/SHA256.txt
          sed 's/emulator Android 11/emulator Android 15/g' mobile43/README.md > deliver43/BACA-DULU.md
          cp android43/app/build/reports/lint-results-debug.html deliver43/LINT.html
          cp android43/app/build/reports/lint-results-debug.xml deliver43/LINT.xml
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('deliver43/Source43.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('android43').rglob('*'):
                  if p.is_file() and not any(x in p.parts for x in ['build','.gradle','.git']):z.write(p,p.as_posix())
              for p in Path('mobile43').rglob('*'):
                  if p.is_file():z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney43-Beta-APK
          path: deliver43/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: MarketMarney43-Build-Diagnostics
          path: android43/app/build/reports/
  android-smoke:
    needs: [build, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MarketMarney43-Beta-APK
          path: apk
      - name: Enable Android emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi
      - name: Install and verify four tabs on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python3 mobile43/test_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarketMarney43-Android-Smoke
          path: android-smoke43/
