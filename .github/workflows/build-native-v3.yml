name: Build MarketMarney Android Native v3
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-native-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download MarketMarney public app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 https://marketmarney.com/icons/icon-512.png -o android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compile native Android debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android-app
      - name: Validate manifest and app identity
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "package:|launchable-activity:|sdkVersion:|targetSdkVersion:"
          "$AAPT" dump badging "$APK" | grep -F 'com.marketmarney.mobile.MainActivity'
          test "$(unzip -Z1 "$APK" | grep -c '^classes.*\.dex$')" -gt 0
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-Android-Native-v3-Beta-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
