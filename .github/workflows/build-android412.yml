name: Marney 4.12 XAUWar Tab
on:
  push:
    branches: [android-v4.12-xauwar-tab]
    paths: ['mobile412/**', '.github/workflows/build-android412.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marney412-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney411-Beta-APK
          run-id: 42218608277
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: base411
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply navigation-only changes to pinned 4.11
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          assert hashlib.sha256(Path('base411/Marney411.apk').read_bytes()).hexdigest()=='e8d80409a39f9a049a2da3227007dd60fa92e554001d1113bcf2b13956e75786'
          with ZipFile('base411/Marney411-Source.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():assert not n.startswith('/') and '..' not in Path(n).parts
              z.extractall('.')
          PY
          python3 mobile412/prepare412.py android43
          cp mobile412/Navigation412Test.java android43/app/src/androidTest/java/com/marketmarney/mobile/Navigation412Test.java
      - name: Compile and lint
        run: gradle --no-daemon --project-dir android43 :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify app and package source
        run: |
          set -euo pipefail
          mkdir -p deliver testapk
          APK=android43/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney412-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney412-Package.txt
          grep -F "name='com.marketmarney.mobile.beta412'" deliver/Marney412-Package.txt
          grep -F "versionName='4.12.0-beta'" deliver/Marney412-Package.txt
          cp "$APK" deliver/Marney412.apk
          cp android43/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk testapk/Marney412-Tests.apk
          cp android43/app/build/reports/lint-results-debug.html deliver/Marney412-Lint.html
          cp preserved412.json deliver/
          sha256sum deliver/Marney412.apk > deliver/Marney412-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import json,hashlib
          for p,h in json.loads(Path('preserved412.json').read_text()).items():assert hashlib.sha256((Path('android43')/p).read_bytes()).hexdigest()==h,p
          with ZipFile('deliver/Marney412-Source.zip','w',ZIP_DEFLATED) as z:
              for root in [Path('android43'),Path('mobile412')]:
                  for p in root.rglob('*'):
                      if not p.is_file() or any(x in p.parts for x in ['build','.gradle','.git','__pycache__']):continue
                      if p.suffix in ['.jks','.keystore','.ttf','.otf','.woff','.woff2'] or p.name in ['local.properties','.env']:continue
                      z.write(p,p)
          Path('deliver/Marney412-Panduan.md').write_text('''# Marney 4.12 XAUWar
          Menu bawah: Beranda, Berita, XAUWar, Market Live, Social Marney.
          XAUWar berada tepat setelah Berita dan membuka halaman yang sudah ada di dalam APK: /assets/xau-war-3d.html?v=7.6.
          Halaman tersebut berstatus demo/simulasi, bukan harga XAU/USD live. Tidak mengaktifkan feed atau perdagangan asli.
          Halaman 3D hanya dimuat ketika dipilih; WebView-nya tidak disimpan ketika meninggalkan tab. Halaman lain mempertahankan cache terbatas 4.11.
          Aset Berita, Social, Reels, grup, profil, animasi pembuka dan kode autentikasi tidak diubah.
          Paket beta terpisah com.marketmarney.mobile.beta412, versionCode 16. Instal bernama Marney 4.12 XAUWar. Jangan hapus versi stabil/utama.
          Sesi login tidak berpindah otomatis. Google Login native belum terdaftar untuk paket beta412. Pengaturan aplikasi utama tetap.
          Tidak mengubah website, Railway, database, izin grup, atau Google Cloud; tidak memublikasikan ke Play Store.
          Tidak menjamin nol lag: halaman XAUWar 3D memerlukan kemampuan perangkat dan koneksi.
          ''')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Marney412-Beta-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Marney412-Test-APK
          path: testapk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Marney412-Build-Diagnostics
          path: android43/app/build/reports/
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney412-Beta-APK
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: Marney412-Test-APK
          path: testapk
      - name: Prepare navigation and public-page checks
        run: |
          python3 -m pip install websocket-client
          cat > test412.sh <<'SH'
          set -euo pipefail
          mkdir -p quality412
          adb shell wm size 480x960
          adb shell wm density 240
          adb install -r apk/Marney412.apk
          adb install -r testapk/Marney412-Tests.apk
          adb logcat -c
          adb shell am instrument -w -r -e class com.marketmarney.mobile.Navigation412Test com.marketmarney.mobile.beta412.test/androidx.test.runner.AndroidJUnitRunner | tee quality412/instrumentation.txt
          grep -Eq 'OK \(6 tests\)' quality412/instrumentation.txt
          adb shell wm density 200
          python3 mobile412/test_public412.py
          SH
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 five native tabs and XAUWar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: bash test412.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney412-Android-Evidence
          path: quality412/
