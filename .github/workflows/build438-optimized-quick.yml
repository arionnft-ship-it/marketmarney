name: Marney 4.38.4 Optimized APK - Build
on:
  push:
    branches: [fix/marney438-premium-stability-20261114]
    paths:
      - 'mobile438/prepare438_social_tv_fix.py'
      - 'mobile438/verify438_social_tv_fix.py'
      - '.github/workflows/build438-optimized-quick.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: marney438-optimized-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$S"
          yes | "$S" --licenses >/dev/null || true
          "$S" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Reconstruct exact reviewed Marney 4.38 source and apply repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile mobile438/prepare438_social_tv_fix.py mobile438/verify438_social_tv_fix.py
          cat mobile428/source.part1 mobile428/source.part2 mobile428/source.part3 mobile428/source.part4 mobile428/source.part5 | base64 -d > /tmp/mobile428-source.tar.gz
          echo '02d81f1767bada09a687d2ae5d08f0d07ec7b85f149943ddbfa40dffa3a479bf  /tmp/mobile428-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mobile428-source.tar.gz -C mobile428
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,stat
          z=Path('mobile419/base418-source.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          with ZipFile(z) as archive:
              assert archive.testzip() is None
              for entry in archive.infolist():
                  path=Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not stat.S_ISLNK(entry.external_attr>>16)
                  if path.parts and path.parts[0]=='android417': archive.extract(entry,'.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py
          mv android419 android420; python3 mobile420/prepare420.py
          mv android420 android421; python3 mobile421/prepare421.py
          mv android421 android422; python3 mobile422/prepare422.py
          mv android422 android423; python3 mobile423/prepare423.py
          mv android423 android424; python3 mobile424/prepare424.py
          mv android424 android425; python3 mobile425/prepare425.py
          python3 final425/finalize425.py
          mv android425 android426; python3 mobile426/prepare426.py
          mv android426 android427; python3 mobile427/prepare427.py
          mv android427 android428; python3 mobile428/prepare428.py
          mv android428 android429; python3 mobile429/prepare429.py
          mv android429 android430; python3 mobile430/prepare430.py
          mv android430 android431; python3 mobile431/prepare431.py
          mv android431 android432; python3 mobile432/prepare432.py
          mv android432 android433; python3 mobile433/prepare433.py
          mv android433 android434; python3 mobile434/prepare434.py
          mv android434 android435; python3 mobile435/prepare435.py
          mv android435 android436; python3 mobile436/prepare436.py
          python3 mobile436/align_legacy_tests436.py
          mv android436 android437; python3 mobile437/prepare437.py
          mv android437 android438; python3 mobile438/prepare438.py
          python3 mobile438/prepare438_tv.py android438
          python3 mobile438/prepare438_social_tv_fix.py android438
          node --check android438/app/src/main/assets/social411/5eab9da17fe2c659.js
          node --check android438/app/src/main/assets/social411/bundle427.js
          node --check android438/app/src/main/assets/group48/4e221ebb961158b1.js
          node --check android438/app/src/main/assets/group48/bundle427.js
          node --check android438/app/src/main/assets/social429.js
          node --check android438/app/src/main/assets/home430.js
          node --check android438/app/src/main/assets/reels46.js
          node --check android438/app/src/main/assets/reels433.js
          node --check android438/app/src/main/assets/lifecycle435.js
          node --check android438/app/src/main/assets/runtime436.js
      - name: Build verified APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir android438 :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p deliver testapk quality438fix
          BASE_APK=android438/app/build/outputs/apk/debug/app-debug.apk
          cp "$BASE_APK" deliver/Marney438-SocialTimeline-TVFix-TestBase.apk
          cp android438/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk testapk/Marney438-SocialTimeline-TVFix-Tests.apk

          cp -a android438 android438-install
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android438-install/app/build.gradle')
          s=p.read_text(encoding='utf-8')
          replacements={
              "applicationId 'com.marketmarney.mobile.beta438'":"applicationId 'com.marketmarney.mobile.beta438opt4'",
              'versionCode 42':'versionCode 46',
              "versionName '4.38.0-beta'":"versionName '4.38.4-optimized'",
          }
          for old,new in replacements.items():
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          gradle --no-daemon --project-dir android438-install :app:assembleDebug
          INSTALL_APK=android438-install/app/build/outputs/apk/debug/app-debug.apk
          cp "$INSTALL_APK" deliver/Marney438-SocialTimeline-TVFix.apk

          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$BASE_APK" > deliver/Marney438-SocialTimeline-TVFix-TestBase-Certificate.txt
          "$BT/apksigner" verify --print-certs "$INSTALL_APK" > deliver/Marney438-SocialTimeline-TVFix-Certificate.txt
          "$BT/aapt" dump badging "$BASE_APK" > deliver/Marney438-SocialTimeline-TVFix-TestBase-Package.txt
          "$BT/aapt" dump badging "$INSTALL_APK" > deliver/Marney438-SocialTimeline-TVFix-Package.txt
          grep -F "name='com.marketmarney.mobile.beta438'" deliver/Marney438-SocialTimeline-TVFix-TestBase-Package.txt
          grep -F "versionCode='42'" deliver/Marney438-SocialTimeline-TVFix-TestBase-Package.txt
          grep -F "versionName='4.38.0-beta'" deliver/Marney438-SocialTimeline-TVFix-TestBase-Package.txt
          grep -F "name='com.marketmarney.mobile.beta438opt4'" deliver/Marney438-SocialTimeline-TVFix-Package.txt
          grep -F "versionCode='46'" deliver/Marney438-SocialTimeline-TVFix-Package.txt
          grep -F "versionName='4.38.4-optimized'" deliver/Marney438-SocialTimeline-TVFix-Package.txt
          python3 mobile438/verify438_social_tv_fix.py android438 android438-install deliver
          cat > deliver/README-INSTALASI.txt <<'TXT'
          MarketMarney 4.38.3 — Optimized Social + TV

          Perbaikan:
          1. Setelah login Social Marney, aplikasi langsung kembali ke Linimasa.
          2. MarketMarney TV mencari tombol SPA terbaru, menunggu katalog asli siap,
             dan dapat memulihkan rute ketika tab dibuka ulang atau aplikasi dilanjutkan.
          3. Opening premium hanya muncul saat pertama kali membuka APK ini.
          4. Tampilan dan seluruh aset Marney 4.38 tetap dipertahankan.

          Package: com.marketmarney.mobile.beta438opt4
          Versi: 4.38.4-optimized

          Paket beta khusus agar dapat dipasang berdampingan dengan APK 4.38.2 sebelumnya.
          Login mungkin perlu dilakukan kembali pada paket baru ini.
          TXT
          (cd deliver && zip -9 MarketMarney438-SocialTimeline-TVFix-Package.zip \
            Marney438-SocialTimeline-TVFix.apk \
            Marney438-SocialTimeline-TVFix.sha256 \
            Marney438-SocialTimeline-TVFix-Package.txt \
            Marney438-SocialTimeline-TVFix-Certificate.txt \
            README-INSTALASI.txt)
          ls -lh deliver/Marney438-SocialTimeline-TVFix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-4383-Optimized-APK
          path: |
            deliver/Marney438-SocialTimeline-TVFix.apk
            deliver/Marney438-SocialTimeline-TVFix.sha256
            deliver/README-INSTALASI.txt
            deliver/Marney438-SocialTimeline-TVFix-Package.txt
            deliver/MarketMarney438-SocialTimeline-TVFix-Package.zip
            quality438fix/static-report.json
          if-no-files-found: error
          retention-days: 30
