name: Build verified WarXAU HD Daily release
on:
  push:
    branches: [warxau-hd-daily-v7-6-release]
    paths:
      - '.github/workflows/build-warxau-hd.yml'
      - 'warxau-hd-v7.6/build_release.py'
      - 'warxau-hd-v7.6/source/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: warxau-hd-daily-v76-release
  cancel-in-progress: false
jobs:
  build-verified-demo:
    if: github.ref == 'refs/heads/warxau-hd-daily-v7-6-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warxau-hd-daily-v7-6-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install exact reproducible asset tools
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 Pillow==12.3.0 brotli==1.2.0
      - name: Verify transport, reconstruct approved HTML, inspect public pages read-only
        run: python warxau-hd-v7.6/build_release.py
      - name: Store verified public demo on release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add warxau-hd-v7.6/dist warxau-hd-v7.6/source
          if git diff --cached --quiet; then
            echo 'Verified output unchanged'
          else
            git commit -m 'Build checksum-verified WarXAU HD Daily v7.6 public DEMO'
            git push origin HEAD:warxau-hd-daily-v7-6-release
          fi
          git rev-parse HEAD
