name: Marney 4.6 Real Video Verification
on:
  push:
    branches: [android-v4.6-reels-premium]
    paths: ['.github/workflows/verify-media46.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact assets and local synthetic MP4
        run: |
          set -euo pipefail
          python3 mobile43/prepare.py
          python3 mobile44/prepare44.py android43
          python3 mobile45/prepare45.py android43
          python3 mobile45/polish45.py android43
          python3 mobile46/prepare46.py android43
          python3 -m pip install playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python3 -m playwright install chromium --with-deps; fi
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=0x10283e:s=360x640:r=12' -f lavfi -i 'sine=frequency=400:sample_rate=22050' -t 4 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -movflags +faststart -c:a aac -b:a 32k test-video.mp4
      - name: Play and swipe actual MP4 with mocked account APIs
        run: python3 mobile46/test_media46.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney46-Real-Video-Evidence
          path: quality46/
