name: Build MarketMarney Android APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate MarketMarney TWA test application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/values app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle <<'END_SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'MarketMarney'
          include ':app'
          END_SETTINGS
          cat > build.gradle <<'END_BUILD'
          plugins { id 'com.android.application' version '8.13.2' apply false }
          END_BUILD
          cat > gradle.properties <<'END_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          END_PROPS
          cat > app/build.gradle <<'END_APP_BUILD'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.marketmarney.mobile'
            compileSdk 36
            defaultConfig {
              applicationId 'com.marketmarney.mobile'
              minSdk 24
              targetSdk 36
              versionCode 1
              versionName '1.0.0'
            }
            buildTypes {
              release { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4' }
          END_APP_BUILD
          cat > app/src/main/AndroidManifest.xml <<'END_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="false" android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher" android:label="@string/app_name"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <meta-data android:name="asset_statements" android:resource="@string/asset_statements" />
              <activity android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                android:exported="true" android:label="@string/app_name">
                <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL"
                  android:value="https://marketmarney.com/index.html" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_IMAGE_DRAWABLE"
                  android:resource="@mipmap/ic_launcher" />
                <meta-data android:name="android.support.customtabs.trusted.SPLASH_SCREEN_BACKGROUND_COLOR"
                  android:resource="@color/brand_navy" />
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
                <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="https" android:host="marketmarney.com"/>
                </intent-filter>
              </activity>
              <activity android:name="com.google.androidbrowserhelper.trusted.FocusActivity"
                android:exported="false"/>
            </application>
          </manifest>
          END_MANIFEST
          cat > app/src/main/res/values/strings.xml <<'END_STRINGS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">MarketMarney</string>
            <string name="asset_statements">[{\"relation\":[\"delegate_permission/common.handle_all_urls\"],\"target\":{\"namespace\":\"web\",\"site\":\"https://marketmarney.com\"}}]</string>
          </resources>
          END_STRINGS
          cat > app/src/main/res/values/colors.xml <<'END_COLORS'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="brand_navy">#041121</color></resources>
          END_COLORS
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://marketmarney.com/icons/icon-512.png \
            --output app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
