name: Test admin analysis upload
on:
  push:
    branches: [feature/admin-analisa-upload-20261110]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser scripts and integration rules
        run: |
          node --check warxau-fbs/analysis-upload-admin.js
          node --check warxau-fbs/analysis-upload-public.js
          node --check warxau-fbs/analysis-upload.cjs
          node --check marney-brand/branding.cjs
          node --test warxau-fbs/analysis-upload.test.cjs
