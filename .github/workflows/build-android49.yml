name: Marney 4.9 Group Profile Repair
on:
  push:
    branches: [android-v4.9-group-profile-fix]
    paths: ['mobile49/**', '.github/workflows/build-android49.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marney49-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney48-Beta-APK
          run-id: 42148964654
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: base48
      - uses: actions/download-artifact@v4
        with:
          name: Marney49-Public-Source
          run-id: 42152730344
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: public49
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply scoped repair to approved source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          assert hashlib.sha256(Path('base48/Marney48.apk').read_bytes()).hexdigest()=='f9266b1cc88c379da1d5688913774dc6e249f1fc30a7660e7f7fcf2e2d9985fe'
          with zipfile.ZipFile('base48/Marney48-Source.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():
                  assert not n.startswith('/') and '..' not in Path(n).parts
              z.extractall('.')
          PY
          python3 mobile49/prepare49.py android43 public49/sources.json
          node --check android43/app/src/main/assets/profile49.js
          node --check android43/app/src/main/assets/social44.js
          node --check android43/app/src/main/assets/navigation47.js
      - name: Build and lint
        run: gradle --no-daemon --project-dir android43 :app:assembleDebug :app:lintDebug
      - name: Verify certificate and collect
        run: |
          set -euo pipefail
          mkdir -p deliver
          APK=android43/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney49-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney49-Package.txt
          grep -F "name='com.marketmarney.mobile.beta49'" deliver/Marney49-Package.txt
          grep -F "versionName='4.9.0-beta'" deliver/Marney49-Package.txt
          cp "$APK" deliver/Marney49.apk
          cp android43/app/build/reports/lint-results-debug.html deliver/Marney49-Lint.html
          sha256sum deliver/Marney49.apk > deliver/Marney49-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('deliver/Marney49-Source.zip','w',ZIP_DEFLATED) as z:
              for root in [Path('android43'),Path('mobile49')]:
                  for p in root.rglob('*'):
                      if not p.is_file() or any(x in p.parts for x in ['build','.gradle','.git','__pycache__']):continue
                      if p.suffix in ['.jks','.keystore'] or p.name in ['local.properties','.env']:continue
                      z.write(p,p)
          Path('deliver/Marney49-Panduan.md').write_text('''# Marney 4.9 Perbaikan
          Memperbaiki aset grup APK yang sebelumnya mendapat 404 ketika service worker website sudah aktif.
          Satu resolver lokal dipakai oleh WebViewClient dan ServiceWorkerClient. API akun/pesan tetap menggunakan server.
          Profil menunggu identitas akun dan menolak tautan placeholder; dari grup menuju profil publik akun, bukan salah ke pengaturan.
          Tampilan profil dan 17 aset publiknya dibundel untuk mengurangi unduhan berulang. Data profil tetap dari server.
          Tampilan, menu atas/bawah, ikon, Reels, dan runtime grup 4.8 dipertahankan.
          Aplikasi uji terpisah com.marketmarney.mobile.beta49. Jangan hapus aplikasi utama.
          Google Login native belum terdaftar untuk package beta49. Login email hanya untuk akun yang sudah memiliki kata sandi.
          Tidak mengubah Railway, database, Google Cloud, akun atau keanggotaan grup. Tidak dipublikasikan ke Play Store.
          Perbaikan belum diukur pada HP pengguna; koneksi dan data media tetap mempengaruhi pemuatan pertama.
          ''')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Marney49-Beta-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Marney49-Build-Diagnostics
          path: android43/app/build/reports/
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney49-Beta-APK
          path: apk
      - name: Prepare read-only regression test
        run: |
          python3 -m pip install websocket-client
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 real worker, group and profile routes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: python3 mobile49/test_device49.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney49-Worker-Device-Evidence
          path: quality49-device/
