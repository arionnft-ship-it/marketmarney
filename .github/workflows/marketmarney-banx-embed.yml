name: MarketMarney Banx Embedded Ticker

on:
  push:
    branches: [feat/banx-licensed-embedded-ticker-20261111]
    paths:
      - 'warxau-fbs/news-ticker.cjs'
      - 'warxau-fbs/news-ticker.test.cjs'
      - 'warxau-fbs/bootstrap.cjs'
      - 'warxau-fbs/Dockerfile.ihsg'
      - '.github/workflows/marketmarney-banx-embed.yml'
  pull_request:
    branches: [feat/social-marney-experience-20261111]
    paths:
      - 'warxau-fbs/news-ticker.cjs'
      - 'warxau-fbs/news-ticker.test.cjs'
      - 'warxau-fbs/bootstrap.cjs'
      - 'warxau-fbs/Dockerfile.ihsg'

permissions:
  contents: read

jobs:
  ticker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate code and widget safeguards
        run: |
          node --check warxau-fbs/news-ticker.cjs
          node --check warxau-fbs/bootstrap.cjs
          node --test warxau-fbs/news-ticker.test.cjs
  full-web-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build actual Railway website Docker image
        run: docker build -f warxau-fbs/Dockerfile.ihsg -t marney-banx-widget-test .
