name: Verify MarketMarney fast images and navigation
on:
  push:
    branches: [feature/marketmarney-speed-20261110]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image processor dependency
        run: npm ci --prefix warxau-fbs --no-audit --no-fund
      - name: Verify speed changes and existing flows
        run: |
          node --check warxau-fbs/performance-runtime.cjs
          cp warxau-fbs/performance-runtime.cjs warxau-fbs/performance-runtime-smoke.cjs
          node warxau-fbs/install-light-theme.cjs warxau-fbs/performance-runtime-smoke.cjs
          node --check warxau-fbs/performance-runtime-smoke.cjs
          rm warxau-fbs/performance-runtime-smoke.cjs
          node --check warxau-fbs/performance-news.cjs
          node --check warxau-fbs/analysis-upload-public.js
          node --test warxau-fbs/performance-runtime.test.cjs
          node --test warxau-fbs/analysis-upload.test.cjs
