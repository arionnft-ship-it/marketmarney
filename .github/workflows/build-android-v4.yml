name: Build MarketMarney Android v4 Premium
on:
  push:
    branches: [android-v4-premium]
    paths:
      - 'android-v4/**'
      - '.github/workflows/build-android-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare branded launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-v4/app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://marketmarney.com/icons/icon-512.png \
            --output android-v4/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file android-v4/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android-v4/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compile APK v4
        run: gradle --no-daemon --project-dir android-v4 :app:assembleDebug
      - name: Validate APK identity and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=android-v4/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E 'package:|launchable-activity:|sdkVersion:|targetSdkVersion:'
          "$AAPT" dump badging "$APK" | grep -F 'com.marketmarney.mobile.MainActivity'
          test "$(unzip -Z1 "$APK" | grep -c '^classes.*\.dex
          sha256sum "$APK" > MARKETMARNEY-APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-Android-v4-Premium-Beta
          path: |
            android-v4/app/build/outputs/apk/debug/app-debug.apk
            MARKETMARNEY-APK-SHA1.txt
            MARKETMARNEY-APK-SHA256.txt
          if-no-files-found: error)" -gt 0
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > MARKETMARNEY-APK-SHA1.txt
          grep 'certificate SHA-1 digest' MARKETMARNEY-APK-SHA1.txt
          sha256sum "$APK" > MARKETMARNEY-APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-Android-v4-Premium-Beta
          path: |
            android-v4/app/build/outputs/apk/debug/app-debug.apk
            MARKETMARNEY-APK-SHA1.txt
            MARKETMARNEY-APK-SHA256.txt
          if-no-files-found: error