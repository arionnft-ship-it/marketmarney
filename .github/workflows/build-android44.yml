name: Social Marney 4.4 Reference Video Beta
on:
  push:
    branches: [android-v4.4-social-reference]
    paths: ['mobile44/**', '.github/workflows/build-android44.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marney44-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare app-only reference design
        run: |
          set -euo pipefail
          python3 mobile43/prepare.py
          python3 mobile44/prepare44.py android43
          node --check mobile44/assets/social44.js
          mkdir -p android43/app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 https://marketmarney.com/icons/icon-512.png -o android43/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android43/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build and lint isolated APK
        run: gradle --no-daemon --project-dir android43 :app:assembleDebug :app:lintDebug
      - name: Verify APK and package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliver
          APK=android43/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney44-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney44-Package.txt
          grep -F "name='com.marketmarney.mobile.beta44'" deliver/Marney44-Package.txt
          grep -F "versionName='4.4.0-beta'" deliver/Marney44-Package.txt
          cp "$APK" deliver/Marney44.apk
          cp mobile44/README.md deliver/Marney44-Panduan.md
          cp android43/app/build/reports/lint-results-debug.html deliver/Marney44-Lint.html
          sha256sum deliver/Marney44.apk > deliver/Marney44-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('deliver/Marney44-Source.zip','w',ZIP_DEFLATED) as z:
              for root in [Path('android43'),Path('mobile44')]:
                  for p in root.rglob('*'):
                      if not p.is_file() or any(x in p.parts for x in ['build','.gradle','.git','__pycache__']):continue
                      if p.suffix in ['.jks','.keystore'] or p.name in ['local.properties','.env']:continue
                      z.write(p,p)
          print('PASS: APK certificate, isolated package and source archive verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney44-Beta-APK
          path: deliver/
          if-no-files-found: error
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MarketMarney44-Beta-APK
          path: apk
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify four tabs and Social guest page on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: python3 mobile44/test_native44.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney44-Android-Verification
          path: device44/
