name: Export Social Marney 4.28 Sources
on:
  push:
    branches: [android-v4.28-social-speed]
    paths: ['.github/workflows/export-social428.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified 4.27 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,stat
          z=Path('mobile419/base418-source.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          with ZipFile(z) as a:
              assert a.testzip() is None
              for e in a.infolist():
                  p=Path(e.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(e.external_attr>>16)
                  if p.parts and p.parts[0]=='android417': a.extract(e,'.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py
          mv android419 android420; python3 mobile420/prepare420.py
          mv android420 android421; python3 mobile421/prepare421.py
          mv android421 android422; python3 mobile422/prepare422.py
          mv android422 android423; python3 mobile423/prepare423.py
          mv android423 android424; python3 mobile424/prepare424.py
          mv android424 android425; python3 mobile425/prepare425.py
          python3 final425/finalize425.py
          mv android425 android426; python3 mobile426/prepare426.py
          mv android426 android427; python3 mobile427/prepare427.py
      - name: Collect Social Marney sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/app/src/main/java/com/marketmarney/mobile export/app/src/main/assets export/app/src/androidTest/java/com/marketmarney/mobile
          cp android427/app/build.gradle export/app/
          cp android427/app/src/main/AndroidManifest.xml export/app/src/main/
          cp android427/app/src/main/java/com/marketmarney/mobile/MainActivity.java export/app/src/main/java/com/marketmarney/mobile/
          cp android427/app/src/main/java/com/marketmarney/mobile/AppResources49.java export/app/src/main/java/com/marketmarney/mobile/
          cp android427/app/src/main/java/com/marketmarney/mobile/Recovery414.java export/app/src/main/java/com/marketmarney/mobile/
          cp -a android427/app/src/main/assets/social411 export/app/src/main/assets/
          cp -a android427/app/src/main/assets/group48 export/app/src/main/assets/
          cp -a android427/app/src/main/assets/profile49 export/app/src/main/assets/
          cp android427/app/src/main/assets/resources49-map.json export/app/src/main/assets/
          cp android427/app/src/main/assets/light425.js export/app/src/main/assets/
          cp android427/app/src/main/assets/chrome424.js export/app/src/main/assets/
          cp android427/app/src/main/assets/depth423.js export/app/src/main/assets/
          cp android427/app/src/main/assets/fast427.css export/app/src/main/assets/
          cp -a android427/app/src/androidTest/java/com/marketmarney/mobile/. export/app/src/androidTest/java/com/marketmarney/mobile/
          find export -type f -printf '%p %s bytes\n' | sort > export/FILELIST.txt
          (cd export && zip -9 -r ../SocialMarney427-Source.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: SocialMarney427-Source
          path: SocialMarney427-Source.zip
          if-no-files-found: error
