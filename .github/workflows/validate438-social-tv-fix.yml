name: Marney 4.38 Social and TV Focused Validation
on:
  push:
    branches: [fix/marney438-social-timeline-tvfix-20261113]
    paths: ['.github/workflows/validate438-social-tv-fix.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$S"
          yes | "$S" --licenses >/dev/null || true
          "$S" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - uses: actions/download-artifact@v4
        with:
          name: Marney438-SocialTimeline-TVFix
          path: artifact
          github-token: ${{ github.token }}
          run-id: 43380574785
      - name: Verify final APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=artifact/deliver/Marney438-SocialTimeline-TVFix.apk
          test -s "$APK"
          sha256sum "$APK" | tee artifact/final-apk.sha256
          grep -F '6be9f133f7e7a8d53de364d1e5d4be05415b55523e040bc7881811e3396cffe3' artifact/final-apk.sha256
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > artifact/final-apk-certificate.txt
          "$BT/aapt" dump badging "$APK" > artifact/final-apk-package.txt
          grep -F "name='com.marketmarney.mobile.beta438tvfix'" artifact/final-apk-package.txt
          grep -F "versionCode='44'" artifact/final-apk-package.txt
          grep -F "versionName='4.38.2-tvfix'" artifact/final-apk-package.txt
      - name: Reconstruct test package
        shell: bash
        run: |
          set -euo pipefail
          cat mobile428/source.part1 mobile428/source.part2 mobile428/source.part3 mobile428/source.part4 mobile428/source.part5 | base64 -d > /tmp/mobile428-source.tar.gz
          echo '02d81f1767bada09a687d2ae5d08f0d07ec7b85f149943ddbfa40dffa3a479bf  /tmp/mobile428-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mobile428-source.tar.gz -C mobile428
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,stat
          z=Path('mobile419/base418-source.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          with ZipFile(z) as archive:
              assert archive.testzip() is None
              for entry in archive.infolist():
                  path=Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not stat.S_ISLNK(entry.external_attr>>16)
                  if path.parts and path.parts[0]=='android417': archive.extract(entry,'.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py
          mv android419 android420; python3 mobile420/prepare420.py
          mv android420 android421; python3 mobile421/prepare421.py
          mv android421 android422; python3 mobile422/prepare422.py
          mv android422 android423; python3 mobile423/prepare423.py
          mv android423 android424; python3 mobile424/prepare424.py
          mv android424 android425; python3 mobile425/prepare425.py
          python3 final425/finalize425.py
          mv android425 android426; python3 mobile426/prepare426.py
          mv android426 android427; python3 mobile427/prepare427.py
          mv android427 android428; python3 mobile428/prepare428.py
          mv android428 android429; python3 mobile429/prepare429.py
          mv android429 android430; python3 mobile430/prepare430.py
          mv android430 android431; python3 mobile431/prepare431.py
          mv android431 android432; python3 mobile432/prepare432.py
          mv android432 android433; python3 mobile433/prepare433.py
          mv android433 android434; python3 mobile434/prepare434.py
          mv android434 android435; python3 mobile435/prepare435.py
          mv android435 android436; python3 mobile436/prepare436.py
          python3 mobile436/align_legacy_tests436.py
          mv android436 android437; python3 mobile437/prepare437.py
          mv android437 android438; python3 mobile438/prepare438.py
          python3 mobile438/prepare438_tv.py android438
          python3 mobile438/prepare438_social_tv_fix.py android438
          gradle --no-daemon --project-dir android438 :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p focused438
          cp android438/app/build/outputs/apk/debug/app-debug.apk focused438/test-base.apk
          cp android438/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk focused438/tests.apk
      - name: Prepare focused emulator checks
        shell: bash
        run: |
          cat > focused438.sh <<'SH'
          set -euo pipefail
          mkdir -p focused438/results
          adb shell wm size 480x960
          adb shell wm density 240
          adb install -r focused438/test-base.apk
          adb install -r focused438/tests.apk

          passed=0
          for attempt in 1 2 3; do
            adb shell pm clear com.marketmarney.mobile.beta438 >/dev/null
            adb logcat -c
            set +e
            adb shell am instrument -w -r \
              -e class 'com.marketmarney.mobile.Social429FullscreenTest#socialPageUsesMediaMarneyAndBottomDock' \
              com.marketmarney.mobile.beta438.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "focused438/results/social-timeline-attempt-${attempt}.txt"
            set -e
            if grep -F 'OK (1 test)' "focused438/results/social-timeline-attempt-${attempt}.txt"; then
              passed=1
              break
            fi
            sleep 4
          done
          test "$passed" -eq 1
          adb logcat -d -s AndroidRuntime:E > focused438/results/base-runtime-errors.txt
          test ! -s focused438/results/base-runtime-errors.txt

          APK=artifact/deliver/Marney438-SocialTimeline-TVFix.apk
          adb install -r "$APK"
          adb shell am force-stop com.marketmarney.mobile.beta438tvfix
          adb logcat -c
          adb shell am start -W \
            -n com.marketmarney.mobile.beta438tvfix/com.marketmarney.mobile.MainActivity \
            --ei startTab 2 | tee focused438/results/tv-start.txt
          tv_ready=0
          for i in $(seq 1 45); do
            adb logcat -d -s MMAPP_TV:I '*:S' > focused438/results/tv-route-log.txt || true
            if grep -F 'ready catalogue=MarketMarney TV' focused438/results/tv-route-log.txt; then
              tv_ready=1
              break
            fi
            sleep 1
          done
          test "$tv_ready" -eq 1
          adb shell dumpsys activity activities > focused438/results/tv-activities.txt
          grep -F 'com.marketmarney.mobile.beta438tvfix/com.marketmarney.mobile.MainActivity' focused438/results/tv-activities.txt
          adb logcat -d -s AndroidRuntime:E > focused438/results/tv-runtime-errors.txt
          test ! -s focused438/results/tv-runtime-errors.txt

          adb shell am force-stop com.marketmarney.mobile.beta438tvfix
          adb logcat -c
          adb shell am start -W \
            -n com.marketmarney.mobile.beta438tvfix/com.marketmarney.mobile.MainActivity \
            --ei startTab 4 | tee focused438/results/social-start.txt
          sleep 8
          adb shell dumpsys activity activities > focused438/results/social-activities.txt
          grep -F 'com.marketmarney.mobile.beta438tvfix/com.marketmarney.mobile.MainActivity' focused438/results/social-activities.txt
          adb shell dumpsys package com.marketmarney.mobile.beta438tvfix > focused438/results/package.txt
          grep -F 'versionName=4.38.2-tvfix' focused438/results/package.txt
          adb logcat -d -s AndroidRuntime:E > focused438/results/social-runtime-errors.txt
          test ! -s focused438/results/social-runtime-errors.txt
          SH
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: bash focused438.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney438-SocialTimeline-TVFix-Validated
          path: |
            artifact/deliver/Marney438-SocialTimeline-TVFix.apk
            artifact/deliver/MarketMarney438-SocialTimeline-TVFix-Package.zip
            artifact/deliver/Marney438-SocialTimeline-TVFix.sha256
            artifact/deliver/README-INSTALASI.txt
            artifact/final-apk-*.txt
            artifact/final-apk.sha256
            focused438/results/
          if-no-files-found: error
          retention-days: 30
