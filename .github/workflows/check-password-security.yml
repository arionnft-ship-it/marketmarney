name: Check Social Marney password security
on:
  push:
    branches: [release/password-security-20261108]
    paths:
      - 'signup/password/**'
      - 'signup/otp/mailer.cjs'
      - 'signup/otp/preflight.cjs'
      - 'warxau-fbs/Dockerfile.ihsg'
      - 'tests/password-security-*'
      - '.github/workflows/check-password-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source, installer and core checks
        shell: bash
        run: |
          mkdir -p password-evidence
          for f in signup/*.cjs signup/otp/*.cjs signup/password/*.cjs tests/password-security-core.cjs; do node --check "$f"; done
          node signup/otp/install.cjs
          node signup/otp/activation.cjs
          node signup/password/install.cjs | tee password-evidence/install-first.txt
          node signup/password/install.cjs | tee password-evidence/install-second.txt
          node tests/password-security-core.cjs | tee password-evidence/core.json
          grep -q '"changedFiles":0' password-evidence/install-second.txt
      - name: Adapt current live account page without writes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          req=urllib.request.Request('https://marketmarney.com/akun.html?password-preview=20261108',headers={'Cache-Control':'no-cache','User-Agent':'MarketMarneyPasswordPreview/1.0'})
          with urllib.request.urlopen(req,timeout=25) as r:
              assert r.status==200
              data=r.read()
          assert len(data)<2_000_000
          open('password-evidence/current-account.html','wb').write(data)
          PY
          node <<'JS'
          const fs=require('fs'),assert=require('assert/strict'),vm=require('vm');
          const ui=require('./signup/password/ui.cjs'),raw=fs.readFileSync('password-evidence/current-account.html','utf8'),out=ui.enhance(raw);
          assert(out.includes('id="mmForgotPanel"')&&out.includes('id="mmChangePasswordForm"'));
          assert.equal(ui.enhance(out),out);
          const ids=[...out.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);assert.equal(new Set(ids).size,ids.length);
          for(const m of out.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi))if(!/\bsrc=/.test(m[1]))new vm.Script(m[2]);
          fs.writeFileSync('password-evidence/transformed-account.html',out);
          console.log(JSON.stringify({bytes:out.length,ids:ids.length,inlineScriptsValid:true}));
          JS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser checks with mocked writes
        shell: bash
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python tests/password-security-ui.py password-evidence/transformed-account.html
      - name: Live read-only verification after activation marker
        if: hashFiles('signup/password/VERIFY-LIVE.txt') != ''
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,time
          base='https://marketmarney.com'
          def request(path,method='GET',body=None):
              data=None if body is None else json.dumps(body).encode()
              headers={'Cache-Control':'no-cache','User-Agent':'MarketMarneyPasswordLiveCheck/1.0'}
              if data is not None:headers.update({'Content-Type':'application/json','X-MarketMarney-Request':'1'})
              req=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,dict(r.headers),r.read()
              except urllib.error.HTTPError as e:return e.code,dict(e.headers),e.read()
          code,_,raw=request('/api/community/status');state=json.loads(raw);assert code==200
          assert state.get('passwordRecovery',{}).get('required') is True and state['passwordRecovery'].get('available') is True
          code,_,page=request('/akun.html?password-live-check=20261108');assert code==200 and b'id="mmForgotPanel"' in page and b'id="mmChangePasswordForm"' in page
          probe=f'not-registered-password-check-{int(time.time())}@example.com'
          code,headers,raw=request('/api/community/password/forgot/otp','POST',{'email':probe});body=json.loads(raw)
          assert code==200 and body.get('ok') is True and len(body.get('challengeId',''))==64
          assert 'otpCode' not in body and 'code' not in body
          for path,allowed in [('/',[200]),('/beranda-trader.html',[200]),('/_railway/health',[200]),('/api/community/me',[401]),('/api/admin/session',[401,404])]:
              status,_,_=request(path);assert status in allowed,(path,status)
          open('password-evidence/live-report.json','w').write(json.dumps({'passwordRecovery':state['passwordRecovery'],'unknownRequestGeneric':True,'accountCreated':False,'realUserEmailSent':False},indent=2))
          print('Live password security checks passed; no user account or real email created.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-marney-password-security
          path: password-evidence/
          retention-days: 7
