name: Build MarketMarney Android Live Beta
on:
  push:
    branches: [fix/site-performance-audit-20261108]
    paths:
      - 'android-app/apply-live-stream.py'
      - '.github/workflows/build-live-marney-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply Live Marney Android integration
        run: python3 android-app/apply-live-stream.py
      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download current MarketMarney icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 https://marketmarney.com/icons/icon-512.png -o android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compile Android Live beta APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android-app
      - name: Validate camera, microphone, identity and APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.CAMERA'
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.RECORD_AUDIO'
          "$AAPT" dump badging "$APK" | grep -F 'com.marketmarney.mobile.MainActivity'
          "$AAPT" dump badging "$APK" | grep -F "versionName='3.1.0-live-beta'"
          sha256sum "$APK"
          cp "$APK" MarketMarney-Live-Beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-Live-Beta-APK
          path: MarketMarney-Live-Beta.apk
          if-no-files-found: error
          retention-days: 30
