name: MarketMarney TV Android Candidate QA
on:
  push:
    branches: [feature/android-marketmarney-tv-20261111]
    paths: ['tv-app/**', '.github/workflows/tv-app-candidate.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: marketmarney-tv-android-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Fast source syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile playstore/*.py compliance/*.py tv-app/*.py
          bash -n tv-app/smoke_tv.sh
          bash -n playstore/smoke-play-candidate.sh
          node --check playstore/only_light_ui.js
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          S="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$S"; yes | "$S" --licenses >/dev/null || true
          "$S" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat mobile428/source.part1 mobile428/source.part2 mobile428/source.part3 mobile428/source.part4 mobile428/source.part5 | base64 -d > /tmp/mobile428-source.tar.gz
          echo '02d81f1767bada09a687d2ae5d08f0d07ec7b85f149943ddbfa40dffa3a479bf  /tmp/mobile428-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/mobile428-source.tar.gz -C mobile428
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,stat
          z=Path('mobile419/base418-source.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          with ZipFile(z) as archive:
              assert archive.testzip() is None
              for entry in archive.infolist():
                  path=Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not stat.S_ISLNK(entry.external_attr>>16)
                  if path.parts and path.parts[0]=='android417': archive.extract(entry,'.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py
          mv android419 android420; python3 mobile420/prepare420.py
          mv android420 android421; python3 mobile421/prepare421.py
          mv android421 android422; python3 mobile422/prepare422.py
          mv android422 android423; python3 mobile423/prepare423.py
          mv android423 android424; python3 mobile424/prepare424.py
          mv android424 android425; python3 mobile425/prepare425.py
          python3 final425/finalize425.py
          mv android425 android426; python3 mobile426/prepare426.py
          mv android426 android427; python3 mobile427/prepare427.py
          mv android427 android428; python3 mobile428/prepare428.py
          mv android428 android429; python3 mobile429/prepare429.py
          mv android429 android430; python3 mobile430/prepare430.py
          mv android430 android431; python3 mobile431/prepare431.py
          mv android431 android432; python3 mobile432/prepare432.py
          mv android432 android433; python3 mobile433/prepare433.py
          mv android433 android434; python3 mobile434/prepare434.py
          mv android434 android435; python3 mobile435/prepare435.py
          mv android435 android436; python3 mobile436/prepare436.py
          python3 mobile436/align_legacy_tests436.py
          mv android436 android437; python3 mobile437/prepare437.py
          mv android437 android438; python3 mobile438/prepare438.py
          mv android438 android439; python3 mobile439/prepare439.py
          node --check android439/app/src/main/assets/social411/5eab9da17fe2c659.js
          node --check android439/app/src/main/assets/social411/bundle427.js
          node --check android439/app/src/main/assets/group48/4e221ebb961158b1.js
          node --check android439/app/src/main/assets/group48/bundle427.js
          node --check android439/app/src/main/assets/social429.js
          node --check android439/app/src/main/assets/home430.js
          node --check android439/app/src/main/assets/reels46.js
          node --check android439/app/src/main/assets/reels433.js
          node --check android439/app/src/main/assets/lifecycle435.js
          node --check android439/app/src/main/assets/runtime436.js
          node --check android439/app/src/main/assets/instant439.js
      - name: Verify unchanged 4.39 beta build
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --project-dir android439 :app:assembleDebug :app:assembleDebugAndroidTest
          mkdir -p qa/deliver qa/testapk play_artifact
          cp android439/app/build/outputs/apk/debug/app-debug.apk qa/deliver/Marney439.apk
          cp android439/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk qa/testapk/Marney439-Tests.apk
          python3 mobile439/verify439.py android439 qa/deliver qa/testapk
      - name: Test startup, Social navigation, light theme and Reels
        shell: bash
        run: |
          cat > /tmp/check-playstore.sh <<'SH'
          set -euo pipefail
          adb install -r qa/deliver/Marney439.apk
          adb install -r qa/testapk/Marney439-Tests.apk
          adb logcat -c
          CLASSES='com.marketmarney.mobile.OpeningSoft426Test,com.marketmarney.mobile.Branding432Test,com.marketmarney.mobile.Performance439Test,com.marketmarney.mobile.Social430HomeButtonTest,com.marketmarney.mobile.Social429FullscreenTest,com.marketmarney.mobile.LightOnly425Test'
          adb shell am instrument -w -r -e class "$CLASSES" com.marketmarney.mobile.beta439.test/androidx.test.runner.AndroidJUnitRunner | tee qa/emulator-regression.txt
          grep -F 'OK (' qa/emulator-regression.txt
          if grep -E 'FAILURES|INSTRUMENTATION_FAILED' qa/emulator-regression.txt; then exit 1; fi
          adb logcat -d -s AndroidRuntime:E > qa/emulator-runtime-errors.txt
          test ! -s qa/emulator-runtime-errors.txt
          SH
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: bash /tmp/check-playstore.sh
      - name: Build Play candidate AAB (no publication)
        shell: bash
        env:
          MM_UPLOAD_KEYSTORE_B64: ${{ secrets.MM_UPLOAD_KEYSTORE_B64 }}
          MM_PLAY_STORE_PASSWORD: ${{ secrets.MM_PLAY_STORE_PASSWORD }}
          MM_PLAY_KEY_ALIAS: ${{ secrets.MM_PLAY_KEY_ALIAS }}
          MM_PLAY_KEY_PASSWORD: ${{ secrets.MM_PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 playstore/prepare_play_candidate.py android439
          python3 tv-app/prepare_tv.py android439
          python3 tv-app/prepare_local_tv.py android439
          python3 tv-app/prepare_native_catalogue.py android439
          python3 tv-app/build_public_snapshot.py android439/app/src/main/assets/marketmarney-tv-catalogue.json
          python3 tv-app/verify_tv.py android439
          cp android439/app/src/main/java/com/marketmarney/mobile/MainActivity.java qa/debug-MainActivity.java
          cp android439/app/src/main/java/com/marketmarney/mobile/StartupOverlay.java qa/debug-StartupOverlay.java
          node --check android439/app/src/main/assets/only_light_ui.js
          grep -F 'asset("only_light_ui.js")' android439/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          grep -F 'showXauLoading' android439/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          grep -F 'mm-play-early-light' android439/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          COUNT=0
          for item in "$MM_UPLOAD_KEYSTORE_B64" "$MM_PLAY_STORE_PASSWORD" "$MM_PLAY_KEY_ALIAS" "$MM_PLAY_KEY_PASSWORD"; do
            if [ -n "$item" ]; then COUNT=$((COUNT+1)); fi
          done
          if [ "$COUNT" -ne 0 ] && [ "$COUNT" -ne 4 ]; then
            echo 'Upload signing secrets are incomplete; stop rather than producing ambiguous builds'
            exit 1
          fi
          if [ "$COUNT" -eq 4 ]; then
            printf '%s' "$MM_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/marketmarney-upload.jks"
            chmod 600 "$RUNNER_TEMP/marketmarney-upload.jks"
            export MM_PLAY_KEYSTORE_PATH="$RUNNER_TEMP/marketmarney-upload.jks"
          fi
          gradle --no-daemon --project-dir android439 :app:bundleRelease :app:assembleRelease
          AAB=android439/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -t "$AAB" | tail -n 2
          unzip -Z1 "$AAB" | grep -F 'base/assets/only_light_ui.js'
          unzip -Z1 "$AAB" | grep -F 'base/assets/marketmarney-tv-catalogue.json'
          unzip -Z1 "$AAB" | grep -F 'base/assets/marketmarney-tv.html'
          cp "$AAB" play_artifact/MarketMarney-Play-Review.aab
          cp android439/play_candidate_metadata.json play_artifact/
          cp android439/app/src/main/assets/marketmarney-tv-catalogue.json play_artifact/tv-published-snapshot.json
          if [ "$COUNT" -eq 4 ]; then
            jarsigner -verify "$AAB" | tee play_artifact/signature.txt
            grep -F 'jar verified' play_artifact/signature.txt
            echo 'Signed candidate: manual Play Console, OAuth, privacy, moderation and device checks still required.' > play_artifact/STATUS.txt
          else
            echo 'UNSIGNED REVIEW BUILD: do not upload this AAB to Google Play.' > play_artifact/STATUS.txt
          fi
          (cd play_artifact && sha256sum MarketMarney-Play-Review.aab > SHA256.txt)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          if [ "$COUNT" -eq 4 ]; then
            RELEASE_APK=android439/app/build/outputs/apk/release/app-release.apk
            test -s "$RELEASE_APK"
            cp "$RELEASE_APK" qa/play-candidate-smoke.apk
          else
            RELEASE_APK=android439/app/build/outputs/apk/release/app-release-unsigned.apk
            test -s "$RELEASE_APK"
            # A disposable QA-only key enables device testing of the release
            # package ID; this APK is NEVER uploaded or distributed.
            keytool -genkeypair -noprompt -alias mm-qa -keyalg RSA -keysize 2048 \
              -validity 1 -dname 'CN=Local CI Smoke,OU=QA,O=MarketMarney' \
              -keystore "$RUNNER_TEMP/mm-qa-only.jks" \
              -storepass 'EphemeralOnlyUseForLocalSmoke123' \
              -keypass 'EphemeralOnlyUseForLocalSmoke123'
            "$BT/zipalign" -f -p 4 "$RELEASE_APK" "$RUNNER_TEMP/mm-qa-aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/mm-qa-only.jks" \
              --ks-key-alias mm-qa --ks-pass pass:EphemeralOnlyUseForLocalSmoke123 \
              --key-pass pass:EphemeralOnlyUseForLocalSmoke123 \
              --out qa/play-candidate-smoke.apk "$RUNNER_TEMP/mm-qa-aligned.apk"
          fi
          "$BT/apksigner" verify --print-certs qa/play-candidate-smoke.apk > qa/play-release-certificate.txt
          "$BT/aapt" dump badging qa/play-candidate-smoke.apk > qa/play-release-badging.txt
          "$BT/aapt" dump permissions qa/play-candidate-smoke.apk > qa/play-release-permissions.txt
          grep -F "name='com.marketmarney.mobile'" qa/play-release-badging.txt
          grep -F "versionCode='44'" qa/play-release-badging.txt
          grep -F "versionName='4.39.0'" qa/play-release-badging.txt
          grep -F "targetSdkVersion:'36'" qa/play-release-badging.txt
          if grep -E 'READ_SMS|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES' qa/play-release-permissions.txt; then
            echo 'Unexpected restricted Android permission; production candidate rejected'
            exit 1
          fi
      - name: Smoke test Play-package build on Android 16
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: bash tv-app/smoke_tv.sh
      - name: Save QA and AAB candidate as private workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-TV-Android-Candidate-QA
          path: |
            play_artifact/
            qa/emulator-regression.txt
            qa/emulator-runtime-errors.txt
            qa/play-*.txt
            qa/play-tv-*.txt
            qa/play-*.png
            qa/play-*.xml
            qa/debug-*.java
          if-no-files-found: warn
