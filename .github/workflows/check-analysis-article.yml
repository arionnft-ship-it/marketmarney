name: Validate analysis detail rendering
on:
  push:
    branches: [feature/analysis-article-reading-20261110]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify client parser and injection safety
        run: |
          node --check warxau-fbs/analysis-article.js
          node --check warxau-fbs/analysis-upload.cjs
          node --test warxau-fbs/analysis-upload.test.cjs

      - name: Test live article layout in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python warxau-fbs/verify-analysis-detail.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketmarney-analysis-reading-check
          path: analysis-detail-verification/
          retention-days: 5
