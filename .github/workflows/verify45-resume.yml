name: Verify Marney 4.5 Warm Tabs
on:
  push:
    branches: [android-v4.5-marney-performance]
    paths: ['.github/workflows/verify45-resume.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney45-Beta-APK
          run-id: 42135545771
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Keep the test focused on changed screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile45/test_native45.py');s=p.read_text()
          assert 'for tab in range(4):' in s
          s=s.replace('for tab in range(4):','for tab in [1,3]:')
          s=s.replace('time.sleep(9);tree,text,ok=wait','time.sleep(15);tree,text,ok=wait')
          s=s.replace("if not raw.lstrip().startswith(b'<?xml'):raise RuntimeError('UI hierarchy unavailable')", "if not raw.lstrip().startswith(b'<?xml'):\n  (OUT/'transport.txt').write_bytes(adb('devices',check=False))\n  (OUT/'fatal.txt').write_bytes(adb('logcat','-d','-s','AndroidRuntime:E',check=False))\n  raise RuntimeError('UI hierarchy unavailable')")
          p.write_text(s);compile(s,str(p),'exec')
          PY
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test same signed APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: python3 mobile45/test_native45.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney45-Warm-Verification
          path: device45/
