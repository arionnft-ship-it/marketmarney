name: Marney 4.22 Clean Home
on:
  push:
    branches: [android-v4.22-clean-home]
    paths: ['mobile422/**', '.github/workflows/build422.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marney422-home-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct verified source and apply the home layout change
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, stat
          source = Path('mobile419/base418-source.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          assert not any(Path(name).exists() for name in ('android417', 'android419', 'android420', 'android421', 'android422'))
          with ZipFile(source) as archive:
              assert archive.testzip() is None
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  if path.parts and path.parts[0] == 'android417': archive.extract(entry, '.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py
          mv android419 android420
          python3 mobile420/prepare420.py
          mv android420 android421
          python3 mobile421/prepare421.py
          mv android421 android422
          python3 mobile422/prepare422.py
      - name: Verify the mobile home layout and preserved navigation
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright
          python3 mobile422/visual_check422.py
      - name: Compile APK
        run: gradle --no-daemon --project-dir android422 :app:assembleDebug
      - name: Verify package and preserved application assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliver
          APK=android422/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney422-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney422-Package.txt
          grep -F "name='com.marketmarney.mobile.beta422'" deliver/Marney422-Package.txt
          grep -F "versionCode='26'" deliver/Marney422-Package.txt
          grep -F "versionName='4.22.0-beta'" deliver/Marney422-Package.txt
          cp "$APK" deliver/Marney422.apk
          cp verified422.json mobile422/Marney422-Panduan.md deliver/
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json
          root=Path('android422')
          manifest=json.loads(Path('verified422.json').read_text())
          for rel,digest in manifest['preserved'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest,rel
          apk=Path('deliver/Marney422.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('deliver/Marney422-SHA256.txt').write_text(digest+'  Marney422.apk\n')
          assets=root/'app/src/main/assets'
          expected={'assets/'+p.relative_to(assets).as_posix():p for p in assets.rglob('*') if p.is_file()}
          with ZipFile(apk) as archive:
              actual={entry.filename for entry in archive.infolist() if entry.filename.startswith('assets/') and not entry.is_dir()}
              assert actual==set(expected), 'APK asset inventory differs from prepared source'
              for name,p in expected.items():
                  assert archive.read(name)==p.read_bytes(),p
          print('APK SHA-256:',digest)
          print('Preserved source files:',len(manifest['preserved']))
          print('Verified APK assets:',len(expected))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Marney422-Final-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney422-Home-Preview
          path: quality422/
          if-no-files-found: error
