name: Marney 4.8 Fast Groups
on:
  push:
    branches: [android-v4.8-fast-groups]
    paths: ['mobile48/**', '.github/workflows/build-android48.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marney48-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preserve approved design and optimize group loading only
        run: |
          set -euo pipefail
          python3 mobile43/prepare.py
          python3 mobile44/prepare44.py android43
          python3 mobile45/prepare45.py android43
          python3 mobile45/polish45.py android43
          python3 mobile46/prepare46.py android43
          python3 mobile47/prepare47.py android43
          python3 mobile48/prepare48.py android43
          node --check baseline48/runtime-after.js
          mkdir -p android43/app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 https://marketmarney.com/icons/icon-512.png -o android43/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Compile and lint
        run: gradle --no-daemon --project-dir android43 :app:assembleDebug :app:lintDebug
      - name: Verify APK and package source
        run: |
          set -euo pipefail
          mkdir -p deliver
          APK=android43/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney48-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney48-Package.txt
          grep -F "name='com.marketmarney.mobile.beta48'" deliver/Marney48-Package.txt
          grep -F "versionName='4.8.0-beta'" deliver/Marney48-Package.txt
          cp "$APK" deliver/Marney48.apk
          cp android43/app/build/reports/lint-results-debug.html deliver/Marney48-Lint.html
          cp baseline48/bundle-report.json deliver/Marney48-Bundle.json
          sha256sum deliver/Marney48.apk > deliver/Marney48-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('deliver/Marney48-Source.zip','w',ZIP_DEFLATED) as z:
              for root in [Path('android43'),Path('mobile48')]:
                  for p in root.rglob('*'):
                      if not p.is_file() or any(x in p.parts for x in ['build','.gradle','.git','__pycache__']):continue
                      if p.suffix in ['.jks','.keystore'] or p.name in ['local.properties','.env']:continue
                      z.write(p,p)
          Path('deliver/Marney48-Panduan.md').write_text('''# Marney 4.8 Fast Groups
          Desain 4.7 dipertahankan. Paket ini fokus pada waktu membuka grup dan pembaruan pesan.
          HTML/CSS/JS publik grup disertakan dalam APK, sehingga tidak diunduh ulang untuk membuka layar grup.
          Sesi dan isi pesan tetap diminta dari server. Tidak ada salinan pesan dalam localStorage atau cache offline.
          Respons group-messages yang sudah memeriksa keanggotaan digunakan langsung, tanpa permintaan detail berulang pada anggota yang berizin.
          Saat akses ditolak, data privat dibersihkan dan detail grup diminta hanya untuk menampilkan status/join yang aman.
          Pada tautan grup langsung, daftar grup dimuat paralel dengan percakapan, setelah sesi terverifikasi.
          Node pesan yang isinya tidak berubah digunakan kembali. Tampilan dan handler kirim/balas asli dipertahankan.
          Package terpisah com.marketmarney.mobile.beta48, versionCode 12. Jangan hapus aplikasi utama.
          Google Login native belum didaftarkan untuk paket beta48. Email hanya untuk akun yang sudah punya kata sandi.
          Tidak mengubah Railway, website, database atau Google Cloud. Tidak dipublikasikan ke Play Store.
          Pemuatan pesan pertama tetap memerlukan internet. Hasil benchmark sintetis bukan pengukuran kecepatan HP pengguna.
          ''')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Marney48-Beta-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney48-Static-Test-Inputs
          path: |
            baseline48/
            android43/app/src/main/assets/
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney48-Static-Test-Inputs
          path: .
      - name: Install browser verification
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
      - name: Compare group opening and check privacy/handler regressions
        run: python3 mobile48/test48.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney48-Comparison
          path: quality48/
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney48-Beta-APK
          path: apk
      - name: Prepare Android smoke check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile45/test_native45.py');s=p.read_text().replace('com.marketmarney.mobile.beta45','com.marketmarney.mobile.beta48').replace('apk/Marney45.apk','apk/Marney48.apk').replace("Path('device45')","Path('device48')")
          s=s.replace('for tab in range(4):','for tab in [1,3]:').replace('time.sleep(9);tree,text,ok=wait','time.sleep(15);tree,text,ok=wait')
          p.write_text(s)
          PY
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 15 install and unchanged warm News/Social navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: python3 mobile45/test_native45.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney48-Device
          path: device48/
