name: Marney 4.21 Transparent App Icon
on:
  push:
    branches: [android-v4.21-transparent-icon]
    paths: ['mobile421/**', '.github/workflows/build421.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marney421-icon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct verified 4.19 source and apply reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow==13.0.0
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, stat
          source = Path('mobile419/base418-source.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == '701601854939d00ec33097c4c483e20c3d3f576d8921d73f273d263c344dadfc'
          assert not Path('android417').exists() and not Path('android419').exists() and not Path('android420').exists()
          with ZipFile(source) as archive:
              assert archive.testzip() is None
              for entry in archive.infolist():
                  path = Path(entry.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  if path.parts and path.parts[0] == 'android417': archive.extract(entry, '.')
          Path('android417').rename('android419')
          PY
          python3 mobile419/prepare419.py
          mv android419 android420
          python3 mobile420/prepare420.py
          mv android420 android421
          python3 mobile421/prepare421.py
      - name: Compile APK and native icon checks
        run: gradle --no-daemon --project-dir android421 :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify package and preserved application assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliver testapk
          APK=android421/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney421-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney421-Package.txt
          grep -F "name='com.marketmarney.mobile.beta421'" deliver/Marney421-Package.txt
          grep -F "versionName='4.21.0-beta'" deliver/Marney421-Package.txt
          cp "$APK" deliver/Marney421.apk
          cp android421/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk testapk/Marney421-Tests.apk
          cp verified421.json mobile421/Marney421-Panduan.md deliver/
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json,re
          root=Path('android421')
          manifest=json.loads(Path('verified421.json').read_text())
          for rel,digest in manifest['preserved'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest,rel
          apk=Path('deliver/Marney421.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('deliver/Marney421-SHA256.txt').write_text(digest+'  Marney421.apk\n')
          assets=root/'app/src/main/assets'
          with ZipFile(apk) as archive:
              for p in assets.rglob('*'):
                  if p.is_file():assert archive.read('assets/'+str(p.relative_to(assets)))==p.read_bytes(),p
          classes=['Premium418Test','Branding417Test','IconTransparency421Test']
          count=sum(len(re.findall(r'(?m)^\s*@Test\b',(root/'app/src/androidTest/java/com/marketmarney/mobile'/(name+'.java')).read_text())) for name in classes)
          assert count==7,count
          Path('testapk/classes.txt').write_text(','.join('com.marketmarney.mobile.'+name for name in classes))
          Path('testapk/count.txt').write_text(str(count))
          print('APK SHA-256:',digest)
          print('Native branding checks:',count)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Marney421-Final-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Marney421-Test-APK
          path: testapk/
          if-no-files-found: error
  icon-render:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Marney421-Final-APK
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: Marney421-Test-APK
          path: testapk
      - name: Prepare exact APK icon rendering check
        shell: bash
        run: |
          set -euo pipefail
          cd apk
          sha256sum -c Marney421-SHA256.txt
          cd ..
          cat > icon-check.sh <<'SH'
          set -euo pipefail
          mkdir -p quality421
          adb shell wm size 480x960
          adb shell wm density 240
          adb install -r apk/Marney421.apk
          adb install -r testapk/Marney421-Tests.apk
          adb logcat -c
          CLASSES="$(cat testapk/classes.txt)"
          COUNT="$(cat testapk/count.txt)"
          adb shell am instrument -w -r -e class "$CLASSES" com.marketmarney.mobile.beta421.test/androidx.test.runner.AndroidJUnitRunner | tee quality421/instrumentation.txt
          adb pull /sdcard/Android/data/com.marketmarney.mobile.beta421/files/icon421-evidence quality421/ || true
          adb logcat -d -s AndroidRuntime:E IconTransparency421:I > quality421/runtime.log
          grep -F "OK ($COUNT tests)" quality421/instrumentation.txt
          SH
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: bash icon-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney421-Icon-Evidence
          path: quality421/
          if-no-files-found: error
