name: MarketMarney LIVE comments and free gifts QA
on:
  push:
    branches: [feature/live-comments-gifts-20261111]
    paths:
      - 'warxau-fbs/live-engagement*'
      - 'warxau-fbs/Dockerfile.ihsg'
      - '.github/workflows/live-engagement-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: marketmarney-live-engagement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-comments-gifts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reconstruct existing verified Live Marney source
        shell: bash
        working-directory: warxau-fbs
        run: |
          set -euo pipefail
          node install-live-stream.cjs
          node --check live-stream.cjs
          node --check live-reels-preload.cjs
          node --check live-engagement.cjs
          node --check live-engagement-preload.cjs
          node --check live-engagement.js
      - name: Exercise Live Marney auth, comments, gifts, SSE and moderation
        shell: bash
        working-directory: warxau-fbs
        run: |
          set -euo pipefail
          MM_LIVE_REELS_UNIT_TEST=1 MM_LIVE_ENGAGEMENT_UNIT_TEST=1 node --test live-stream.test.cjs live-reels.test.cjs live-engagement.test.cjs
      - name: Test viewer and host comment/gift interface in browser DOM
        shell: bash
        working-directory: warxau-fbs
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/mm-live-chat-dom" --no-save --no-audit --no-fund jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/mm-live-chat-dom/node_modules" node --test live-engagement-dom.test.cjs
      - name: Verify no payment processing or new camera requirement
        shell: bash
        run: |
          set -euo pipefail
          grep -F "giftsAreFree:true" warxau-fbs/live-engagement.cjs
          grep -F "monetaryValue:0" warxau-fbs/live-engagement.cjs
          grep -F "viewerAuth:'existing Live Marney bearer token'" warxau-fbs/live-engagement-preload.cjs
          grep -F -- '--require=/opt/warxau-fbs/live-engagement-preload.cjs' warxau-fbs/Dockerfile.ihsg
          ! grep -E 'PaymentRequest|checkout|purchase|stripe|qris|getUserMedia' warxau-fbs/live-engagement.js
          echo 'PASS: gift interactions are non-monetary and viewer-only'
  build-image:
    needs: test-comments-gifts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile complete MarketMarney Docker image (do not deploy)
        run: |
          set -euo pipefail
          docker build -f warxau-fbs/Dockerfile.ihsg -t marketmarney-live-engagement:qa .
          docker image inspect marketmarney-live-engagement:qa --format 'IMAGE_VALID {{.Id}}'
