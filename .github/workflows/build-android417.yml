name: Marney 4.17 MARNEY Branding
on:
  push:
    branches: [android-v4.17-marney-logo]
    paths: ['mobile417/**', '.github/workflows/build-android417.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marney417-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify and materialize the exact reviewed source
        run: python3 mobile417/prepare417.py
      - name: Build app and Android tests
        run: gradle --no-daemon --project-dir android417 :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify signed package and deliver source
        run: |
          set -euo pipefail
          mkdir -p deliver testapk
          APK=android417/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney417-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney417-Package.txt
          grep -F "name='com.marketmarney.mobile.beta417'" deliver/Marney417-Package.txt
          grep -F "versionName='4.17.0-beta'" deliver/Marney417-Package.txt
          cp "$APK" deliver/Marney417.apk
          cp android417/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk testapk/Marney417-Tests.apk
          cp android417/app/build/reports/lint-results-debug.html deliver/Marney417-Lint.html
          cp mobile417/files417.json deliver/Marney417-Source-Hashes.json
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib,json,os
          manifest=json.loads(Path('mobile417/files417.json').read_text())
          root=Path('android417')
          for name,expected in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          with ZipFile('deliver/Marney417-Source.zip','w',ZIP_DEFLATED) as z:
              for name in sorted(manifest['files']):z.write(root/name,'android417/'+name)
              z.write('mobile417/README.md','README.md')
          with ZipFile('deliver/Marney417.apk') as z:
              assert hashlib.sha256(z.read('assets/brand417/logo.png')).hexdigest()==manifest['logo_sha256']
          Path('deliver/Marney417-Panduan.txt').write_text('''Marney 4.17 — Logo MARNEY
          Logo M + MARNEY yang disetujui dipakai pada ikon, opening, Berita, Social Marney, Reels, grup, profil, dan penanda merek di halaman web dalam aplikasi.
          Basis: Marney 4.16 final. Lima menu, galeri, pesan, profil, login email, dan perilaku opening tetap dipertahankan.
          Ini APK beta terpisah com.marketmarney.mobile.beta417. Pasang sebagai aplikasi baru; tidak perlu menghapus aplikasi lama. Sesi login lama tidak otomatis berpindah.
          Google Login native belum didaftarkan untuk paket beta417. Login email yang sudah tersedia tetap dapat digunakan.
          Website/backend dan Play Store tidak diubah oleh build ini. Kecepatan pada HP pengguna belum diukur.
          ''')
          checks={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('deliver').iterdir()) if p.is_file()}
          Path('deliver/Marney417-SHA256.json').write_text(json.dumps(checks,indent=2)+'\n')
          Path('deliver/Marney417-Build.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'baseCommit':manifest['base_commit'],'version':'4.17.0-beta','package':'com.marketmarney.mobile.beta417'},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Marney417-Branding-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Marney417-Branding-Test-APK
          path: testapk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Marney417-Build-Diagnostics
          path: android417/app/build/reports/
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        api: [35,29]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Marney417-Branding-APK
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: Marney417-Branding-Test-APK
          path: testapk
      - name: Prepare Android verification
        env:
          API: ${{ matrix.api }}
        run: |
          cat > check417.sh <<'SH'
          set -euo pipefail
          mkdir -p evidence417
          adb shell wm size 480x960
          adb shell wm density 200
          adb install -r apk/Marney417.apk
          adb install -r testapk/Marney417-Tests.apk
          adb logcat -c
          CLASSES=com.marketmarney.mobile.Opening416Test,com.marketmarney.mobile.GalleryPolicy415Test,com.marketmarney.mobile.Branding417Test
          COUNT=29
          if [ "$API" = 35 ]; then
            CLASSES=$CLASSES,com.marketmarney.mobile.GalleryUi415Test,com.marketmarney.mobile.Stability414Test,com.marketmarney.mobile.Navigation413Test,com.marketmarney.mobile.AdaptGuardTest
            COUNT=54
          fi
          adb shell am instrument -w -r -e class "$CLASSES" com.marketmarney.mobile.beta417.test/androidx.test.runner.AndroidJUnitRunner | tee evidence417/instrumentation.txt
          adb pull /sdcard/Android/data/com.marketmarney.mobile.beta417/files/opening416-tests evidence417/ || true
          adb pull /sdcard/Android/data/com.marketmarney.mobile.beta417/files/gallery-tests evidence417/ || true
          adb pull /sdcard/Android/data/com.marketmarney.mobile.beta417/files/stability-tests evidence417/ || true
          adb logcat -d -s MM416_LAUNCH:I AndroidRuntime:E > evidence417/runtime.log
          grep -Eq "OK \($COUNT tests\)" evidence417/instrumentation.txt
          SH
          echo "API=$API" >> "$GITHUB_ENV"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: bash check417.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney417-Android-${{ matrix.api }}-Evidence
          path: evidence417/
