name: Marney 4.5 Original Icons and Warm Navigation
on:
  push:
    branches: [android-v4.5-marney-performance]
    paths: ['mobile45/**', '.github/workflows/build-android45.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: marney45-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare scoped APK change
        run: |
          set -euo pipefail
          python3 mobile43/prepare.py
          python3 mobile44/prepare44.py android43
          python3 mobile45/prepare45.py android43
          python3 mobile45/polish45.py android43
          node --check android43/app/src/main/assets/social44.js
          mkdir -p android43/app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 https://marketmarney.com/icons/icon-512.png -o android43/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build and lint
        run: gradle --no-daemon --project-dir android43 :app:assembleDebug :app:lintDebug
      - name: Validate package and collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliver
          APK=android43/app/build/outputs/apk/debug/app-debug.apk
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" > deliver/Marney45-Certificate.txt
          "$BT/aapt" dump badging "$APK" > deliver/Marney45-Package.txt
          grep -F "name='com.marketmarney.mobile.beta45'" deliver/Marney45-Package.txt
          grep -F "versionName='4.5.0-beta'" deliver/Marney45-Package.txt
          cp "$APK" deliver/Marney45.apk
          cp android43/app/build/reports/lint-results-debug.html deliver/Marney45-Lint.html
          sha256sum deliver/Marney45.apk > deliver/Marney45-SHA256.txt
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('deliver/Marney45-Source.zip','w',ZIP_DEFLATED) as z:
              for root in [Path('android43'),Path('mobile45')]:
                  for p in root.rglob('*'):
                      if not p.is_file() or any(x in p.parts for x in ['build','.gradle','.git','__pycache__']):continue
                      if p.suffix in ['.jks','.keystore'] or p.name in ['local.properties','.env']:continue
                      z.write(p,p)
          Path('deliver/Marney45-Panduan.md').write_text('''# Social Marney 4.5 Beta
          Ikon Pesan memakai Dialogue-M, bukan pesawat kertas. Notifikasi memakai lonceng Pulse, bukan hati.
          Tab utama tetap Beranda, Berita, Market Live, Social Marney.
          APK menyimpan maksimal satu halaman tidak aktif dan satu halaman aktif. Halaman pertama masih memerlukan jaringan.
          Media tidak diputar otomatis. Video yang tidak terlihat dijeda; pemuatan awal video dikurangi.
          Aplikasi uji terpisah: com.marketmarney.mobile.beta45. Jangan hapus APK utama.
          Google Login native pada paket beta45 belum terdaftar. Login email hanya untuk akun yang sudah memiliki kata sandi.
          Website, Railway, database, akun dan konfigurasi Google Cloud tidak diubah. Tidak dipublikasikan ke Play Store.
          Keystore privat tidak disertakan. Build ini bukan rilis produksi.
          ''')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Marney45-Beta-APK
          path: deliver/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Marney45-Build-Diagnostics
          path: android43/app/build/reports/
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Marney45-Beta-APK
          path: apk
      - name: Enable emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Verify read-only public responses
        run: |
          mkdir -p device45
          python3 - <<'PY'
          import urllib.request,time,json
          from pathlib import Path
          results=[]
          for path in ['/index.html','/beranda-trader.html','/api/auth/android/config']:
              t=time.monotonic()
              try:
                  req=urllib.request.Request('https://marketmarney.com'+path,headers={'User-Agent':'MarneyPerformanceReadOnly/4.5'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      size=len(r.read(1000000));results.append({'path':path,'status':r.status,'ms':round((time.monotonic()-t)*1000),'bytes':size})
              except Exception as e:results.append({'path':path,'error':str(e)})
          Path('device45/network.json').write_text(json.dumps(results,indent=2));print(json.dumps(results))
          PY
      - name: Verify four tabs and warm reuse on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -dns-server 8.8.8.8,8.8.4.4
          script: python3 mobile45/test_native45.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Marney45-Device-Evidence
          path: device45/
