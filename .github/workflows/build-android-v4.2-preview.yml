name: Build MarketMarney Android v4.2 Side-by-Side Preview
on:
  push:
    branches: [android-v4.2-beranda-website]
    paths:
      - 'android-v4/**'
      - '.github/workflows/build-android-v4.2-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify homepage webview configuration
        shell: bash
        run: |
          set -euo pipefail
          MAIN=android-v4/app/src/main/java/com/marketmarney/mobile/MainActivity.java
          grep -Fq 'showWeb("Beranda", "/index.html", true)' "$MAIN"
          grep -Fq 'if (!homepage) panel.addView(toolbar' "$MAIN"
          grep -Fq 'appHeader.setVisibility(websiteHome ? View.GONE' "$MAIN"
          grep -Fq 'else if (tab != NAV_HOME) navigate(NAV_HOME);' "$MAIN"
          echo "PASS: Beranda website is the APK home screen; native tabs remain."
      - name: Prepare branded launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-v4/app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            https://marketmarney.com/icons/icon-512.png \
            --output android-v4/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file android-v4/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android-v4/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Make this test APK install alongside v4.1
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/applicationId 'com.marketmarney.mobile'/applicationId 'com.marketmarney.mobile.preview'/" android-v4/app/build.gradle
          sed -i 's#<string name="app_name">MarketMarney</string>#<string name="app_name">MarketMarney Preview</string>#' android-v4/app/src/main/res/values/strings.xml
          grep -Fq "applicationId 'com.marketmarney.mobile.preview'" android-v4/app/build.gradle
          grep -Fq 'MarketMarney Preview' android-v4/app/src/main/res/values/strings.xml
          echo 'PASS: Preview app can be installed alongside the existing MarketMarney APK.'
      - name: Compile APK v4
        run: gradle --no-daemon --project-dir android-v4 :app:assembleDebug
      - name: Validate APK identity and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=android-v4/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print -quit)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E 'package:|launchable-activity:|sdkVersion:|targetSdkVersion:'
          "$AAPT" dump badging "$APK" | grep -F 'com.marketmarney.mobile.MainActivity'
          test "$(unzip -Z1 "$APK" | grep -c '^classes.*\.dex$')" -gt 0
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > MARKETMARNEY-APK-SHA1.txt
          grep 'certificate SHA-1 digest' MARKETMARNEY-APK-SHA1.txt
          sha256sum "$APK" > MARKETMARNEY-APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMarney-Android-v4.2-Beranda-Preview
          path: |
            android-v4/app/build/outputs/apk/debug/app-debug.apk
            MARKETMARNEY-APK-SHA1.txt
            MARKETMARNEY-APK-SHA256.txt
          if-no-files-found: error