name: Patch MarketMarney 4.35 Test Harness
on:
  push:
    branches: [android-v4.35-stability]
    paths: ['tools/patch_prepare435.py', '.github/workflows/patch435.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: patch-marketmarney435-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified 4.35 preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_prepare435.py
          if git diff --quiet -- mobile435/prepare435.py; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile435/prepare435.py
          git commit -m 'Stabilize 4.35 document adaptation regression test'
          git push origin HEAD:android-v4.35-stability
