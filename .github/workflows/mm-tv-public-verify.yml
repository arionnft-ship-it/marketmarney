name: Verify new MarketMarney Academy Trading Deep lesson
on:
  push:
    branches: [work/marketmarney-tv-upload-20261111]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe media streaming GET vs HEAD and existing videos
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          base='https://marketmarney.com'
          vid='b0f53a59-4bcb-4423-96ee-a857efdd5371'
          with urllib.request.urlopen(base+'/api/content',timeout=20) as r:d=json.load(r)
          matching=[v for v in d.get('videos',[]) if v.get('id')==vid]
          print('METADATA',len(matching),'all',len(d.get('videos',[])),flush=True)
          assert len(d.get('videos',[]))>=6 and len(matching)==1 and matching[0].get('status')=='published',('video_catalog_invalid',len(d.get('videos',[])),matching)
          entries=[
            ('oldvideo','/media/09af70e5-14a3-4b7b-89d8-64a8c97e09f9.mp4'),
            ('newvideo','/media/'+vid+'.mp4'),
            ('thumbnail','/media/'+vid+'.jpg')
          ]
          success={}
          for name,path in entries:
            for method in ['HEAD','GET']:
              req=urllib.request.Request(base+path,method=method,headers={'User-Agent':'MarketMarney-TV-Check/1.0','Range':'bytes=0-1023'} if method=='GET' else {'User-Agent':'MarketMarney-TV-Check/1.0'})
              try:
                with urllib.request.urlopen(req,timeout=20) as r:
                  part=r.read(32) if method=='GET' else b''
                  print(name,method,'status',r.status,'type',r.headers.get('Content-Type'),'length',r.headers.get('Content-Length'),'range',r.headers.get('Content-Range'),'head',part[:16].hex(),flush=True)
                  if method=='GET': success[name]=r.status in (200,206) and (part[4:8]==b'ftyp' if name.endswith('video') else part[:3]==bytes.fromhex('ffd8ff'))
              except urllib.error.HTTPError as e:
                print(name,method,'HTTPERROR',e.code,'type',e.headers.get('Content-Type'),'body',e.read(130),flush=True)
                if method=='GET':success[name]=False
              except Exception as e:
                print(name,method,'ERROR',str(e)[:120],flush=True)
                if method=='GET':success[name]=False
          print('GET_RESULTS',success,flush=True)
          assert len(matching)==1
          assert success.get('newvideo') and success.get('thumbnail'),'new media cannot be streamed'
          PY
